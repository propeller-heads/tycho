[workspace]
resolver = "2"
members = [
    "crates/tycho",
    "crates/tycho-common",
    "crates/tycho-client",
    "crates/tycho-storage",
    "crates/tycho-ethereum",
    "crates/tycho-indexer",
    "crates/tycho-protobuf",
    "crates/tycho-simulation",
    "crates/tycho-test",
    "crates/tycho-integration-test",
    "crates/tycho-execution",
    "crates/tycho-execution/model",
    "protocols/testing",
]
# protocols/substreams/ and crates/tycho-execution/substreams/ are intentionally excluded —
# separate WASM workspaces, different toolchain
exclude = ["crates/tycho-execution/substreams"]

[workspace.package]
version = "0.502.0"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/propeller-heads/tycho"
homepage = "https://www.propellerheads.xyz/tycho"
documentation = "https://docs.propellerheads.xyz/tycho"
keywords = ["propellerheads", "solver", "defi", "dex", "mev"]
categories = ["finance", "cryptography::cryptocurrencies"]
readme = "README.md"

[workspace.dependencies]
# --- Internal crates (path deps) ---
tycho                  = { path = "crates/tycho",                  version = "0.502.0" }
tycho-common           = { path = "crates/tycho-common",           version = "0.502.0" }
tycho-client           = { path = "crates/tycho-client",           version = "0.502.0" }
tycho-protobuf         = { path = "crates/tycho-protobuf",         version = "0.502.0" }
tycho-storage          = { path = "crates/tycho-storage",          version = "0.502.0" }
tycho-ethereum         = { path = "crates/tycho-ethereum",         version = "0.502.0" }
tycho-indexer          = { path = "crates/tycho-indexer",          version = "0.502.0" }
tycho-simulation       = { path = "crates/tycho-simulation",       version = "0.502.0" }
tycho-test             = { path = "crates/tycho-test",             version = "0.502.0" }
tycho-integration-test = { path = "crates/tycho-integration-test", version = "0.502.0" }
tycho-execution        = { path = "crates/tycho-execution",        version = "0.502.0" }

# --- Serialization/Deserialization ---
serde = { version = "1.0.204", features = ["rc", "derive"] }
serde_json = "1.0.120"
serde_with = "3.16.1"
toml = "0.8"
typetag = "0.2.21"
uuid = { version = "1.4.1", features = ["serde", "macro-diagnostics"] }

# --- Async & concurrency ---
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
futures03 = { package = "futures", version = "0.3.31", features = ["compat"] }
async-trait = "0.1.88"
async-stream = "0.3.6"
# Pinned at 0.20 for tycho-client; simulation's book-feeds feature uses 0.28 directly (separate semver)
tokio-tungstenite = { version = "0.20.0", features = ["native-tls"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# --- Logging & tracing ---
tracing = "0.1.41"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.17", default-features = false }
console-subscriber = "0.2.0"

# --- Error handling ---
thiserror = "1"
anyhow = "1.0.76"

# --- EVM / Blockchain ---
alloy = { version = "1.1.0", default-features = false }
ethabi = "18.0.0"

# --- Utility ---
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.26", default-features = false, features = ["serde", "clock", "std"] }
derive_more = { version = "2.0", features = ["debug", "deref", "from"] }
hex = "0.4.3"
hex-literal = "0.4.1"
rand = "0.8.5"
strum = "0.25.0"
strum_macros = "0.25.2"
num-traits = "0.2.17"
num-bigint = { version = "0.4.6", features = ["serde"] }
ruint = { version = "1.17.1", features = ["num-traits"] }
itertools = "0.13.0"
lru = "0.16.3"
roaring = "0.10"
dotenv = "0.15.0"
deepsize = "0.2.0"
unicode-segmentation = "1.12.0"
clap = "4.5.48"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "native-tls",
] }

# --- Storage ---
diesel = { version = "2.3.9", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.7.4", features = ["postgres", "deadpool"] }

# --- OpenAPI ---
utoipa = { version = "4.2.0", features = ["chrono"] }

# --- Testing ---
mockall = "0.13"
mockito = "1.1.1"
pretty_assertions = "1.4.0"
rstest = "0.24.0"

# Lints beyond clippy's default groups. Every member crate opts in with `[lints] workspace = true`.
# A deliberate exception is suppressed at the site with `#[expect(clippy::<lint>, reason = "...")]`.
[workspace.lints.clippy]
# Control flow: keep the happy path unindented.
manual_let_else = "warn"
redundant_else = "warn"
needless_continue = "warn"
# Parameters and receivers: borrow what is only read, take ownership of what is kept.
needless_pass_by_value = "warn"
needless_pass_by_ref_mut = "warn"
unused_self = "warn"
self_only_used_in_recursion = "warn"
ref_option = "warn"
ref_option_ref = "warn"
renamed_function_params = "warn"
# Allocation.
or_fun_call = "warn"
needless_collect = "warn"
redundant_clone = "warn"
# Visibility.
redundant_pub_crate = "warn"
partial_pub_fields = "warn"
same_name_method = "warn"
# Types that make invalid states unrepresentable.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
option_option = "warn"
unnecessary_wraps = "warn"
iter_not_returning_iterator = "warn"
# Errors are propagated with their source, not discarded or turned into panics.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
match_wild_err_arm = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
fallible_impl_from = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
# Exhaustive matches, so that a new variant is handled everywhere it matters. A wildcard arm on a
# foreign #[non_exhaustive] enum is required; suppress the lint there.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
rest_pat_in_fully_bound_structs = "warn"
# Numeric casts that can truncate, wrap or drop the sign.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# Suppressions use #[expect] with a reason, so one that stops suppressing anything is reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Dead code and tests.
collection_is_never_read = "warn"
no_effect_underscore_binding = "warn"
should_panic_without_expect = "warn"
ignore_without_reason = "warn"
# Lock guards.
significant_drop_in_scrutinee = "warn"

[profile.substreams]
inherits = "release"
opt-level = 'z'
strip = "debuginfo"
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1  # line tables for jeprof — human-readable stacks without full debuginfo overhead

[profile.dev]
debug = 0
