# Exceptions for the osv-scanner gate in .github/workflows/security.yaml, which scans the crates the
# workspace builds (.github/scripts/osv-package-list.sh) against OSV (RustSec and GitHub
# advisories). Ignoring an ID also ignores its aliases.
#
# Every entry expires. After its `ignoreUntil` date the advisory fails the scheduled scan again and
# the entry counts as unused, so it gets a fresh decision instead of living on unreviewed. An entry
# that no longer matches the package list fails CI as well
# (.github/scripts/check-osv-scanner-config.sh) and has to be deleted.
#
# Two review dates: 2027-02-08 where the fix is an upgrade on our side, 2027-05-10 where it waits on
# an upstream release.
#
# `ignoreUntil` is the key osv-scanner 2.7.0 reads, the version mise.toml pins. 2.7.1 renames it to
# `effectiveUntil` and warns on the old name, which fails the config check.

# tonic 0.9, the tycho-indexer Substreams client, is the only root of rustls 0.21. Fixed by tonic
# 0.14 with prost 0.14 and regenerated tycho-indexer protobuf code.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0098"
ignoreUntil = 2027-02-08
reason = "rustls-webpki 0.101.7: URI name constraints accepted; via rustls 0.21 from tonic 0.9"

