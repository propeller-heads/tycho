[advisories]
# Each entry names the affected crate and version, the issue, how it reaches us, and what blocks
# the fix. "Lockfile only" means the crate is an optional dependency that Cargo.lock resolves but
# no workspace build compiles (cargo tree --all-features --target all does not show it).
ignore = [
    "RUSTSEC-2025-0055", # tracing-subscriber 0.2.25: ANSI escape log poisoning; lockfile only, via ark-relations 0.5 (ark-r1cs-std); fixed in 0.3.20, which ark-relations does not allow
    "RUSTSEC-2026-0098", # rustls-webpki 0.101.7: URI name constraints accepted; via rustls 0.21 from tonic 0.9 (tycho-indexer substreams client) and aws-smithy-http-client's legacy rustls; fixed in 0.103.12, which needs tonic 0.12+ (prost 0.13, regenerated src/pb)
    "RUSTSEC-2026-0099", # rustls-webpki 0.101.7: wildcard name constraints accepted; same chain and blocker as RUSTSEC-2026-0098
    "RUSTSEC-2026-0104", # rustls-webpki 0.101.7: reachable panic parsing CRLs; same chain and blocker as RUSTSEC-2026-0098, fixed in 0.103.13
    "RUSTSEC-2026-0382", # rustls-webpki 0.101.7: may accept distrusted intermediates; same chain and blocker as RUSTSEC-2026-0098, fixed in 0.103.16 (which we also use)
    "RUSTSEC-2026-0346", # rustls 0.21.12: Debug impls expose TLS session secrets; via tonic 0.9 and aws-smithy-http-client's legacy rustls; fixed only in 0.23.46 (which we also use), no 0.21 fix
    "RUSTSEC-2026-0349", # rustls 0.21.12: ServerHello downgrade to classical key exchange; same chain and blocker as RUSTSEC-2026-0346
    "RUSTSEC-2026-0258", # h2 0.3.27: unbounded empty DATA frames (low-severity DoS); via actix-http 3, hyper 0.14 (tonic 0.9-0.11) and aws-smithy-http-client; fixed only in 0.4.16 (which we also use), no 0.3 fix
    "RUSTSEC-2026-0367", # zip 0.6.6: SUID/SGID bits kept on extraction; build-dependency of utoipa-swagger-ui 6, whose build script unpacks its own bundled archive with its own loop, not ZipArchive::extract; fixed in 9.0, which needs utoipa-swagger-ui 10 and utoipa 6 (we are on 4)
    "RUSTSEC-2026-0368", # zip 0.6.6: extract creates symlinks outside the destination; same chain and blocker as RUSTSEC-2026-0367
    "RUSTSEC-2026-0369", # zip 0.6.6: extract applies permissions through symlinks; same chain and blocker as RUSTSEC-2026-0367
    "RUSTSEC-2026-0429", # zip 0.6.6: extract aborts on an oversized symlink entry; same chain and blocker as RUSTSEC-2026-0367
    "RUSTSEC-2026-0387", # crypto-bigint 0.4.9/0.5.5: timing variability; via aws-sigv4 (aws-sdk-s3, aws-config) and elliptic-curve 0.12/0.13 (alloy-signer, k256); fixed in 0.7.6, which neither the latest aws-sigv4 nor any alloy 1.x release allows
]
