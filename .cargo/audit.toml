[advisories]
# rustls-webpki 0.101.7 is locked by tonic 0.9; fix requires tonic 0.11+ (prost 0.11 -> 0.12).
# RUSTSEC-2025-0055: tracing-subscriber ^0.2 log poisoning via ANSI escapes
# Dep chain: tycho-simulation <- revm <- ark-bn254 <- ark-r1cs-std <- ark-relations <- tracing-subscriber ^0.2
# We need ark to update their dependencies to fix this.
# RUSTSEC-2026-0258: h2 unbounded empty DATA frames (low severity DoS)
# Only patched in h2 >= 0.4.16 (which we use). The 0.3.x line has no fix and is pulled in by
# actix-http 3.x, hyper 0.14 (tonic 0.9-0.11) and aws-smithy-http-client; nothing to bump.
# RUSTSEC-2026-0346, RUSTSEC-2026-0349: rustls session secrets in Debug, ServerHello downgrade
# Only patched in rustls >= 0.23.46 (which we use). The 0.21.x line has no fix and is pulled in
# by tonic 0.9 (tokio-rustls 0.24) and aws-sdk-s3's legacy rustls feature.
# RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369: zip extraction (SUID/SGID bits,
# symlink targets, permissions through symlinks). Only patched in zip >= 9.0.0. zip 0.6.6 is a
# build-dependency of utoipa-swagger-ui 6.0.0, whose build script extracts the Swagger UI archive
# bundled in the crate itself. The latest utoipa-swagger-ui (10.0.1) still requires zip ^8.6.
# RUSTSEC-2026-0382: rustls-webpki may accept distrusted intermediates. Only patched in
# rustls-webpki >= 0.103.16 (which we use). The 0.101.x line has no fix and is pulled in by
# rustls 0.21 (tonic 0.9 and aws-sdk-s3's legacy rustls feature).
ignore = [
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2025-0055",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0382",
]
