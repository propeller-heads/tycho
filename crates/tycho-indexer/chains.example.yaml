# Example custom-chains config — copy to your own file and edit, then point the indexer at it via
# the `--chain-config <path>` flag (default `./chains.yaml`).
#
# This file defines custom (non-built-in) chains by name so that an extractor's `chain: <name>` (in
# extractors.yaml) and the `--chains <name>` flag resolve to a full chain config. Built-in chains
# (ethereum, base, unichain, …) need no entry here. Other tooling (e.g. tycho-execution) can point
# the `TYCHO_CHAIN_CONFIG` env var at this same file to share the definitions.

chains:
  - name: tempo                       # the value used as `chain:` on extractors and in `--chains`
    chain_id: <tempo chain id>        # EVM chain id
    block_time_secs: 1
    native:                           # native gas token
      address: "0x0000000000000000000000000000000000000000"
      symbol: "ETH"
      decimals: 18
    wrapped_native:                   # wrapped native token (e.g. WETH)
      address: "0x0000000000000000000000000000000000000000"
      symbol: "WETH"
      decimals: 18
    default_tvl_thresholds:           # TVL gates (in native token units) for component tracking
      low: 1000
      medium: 10000
