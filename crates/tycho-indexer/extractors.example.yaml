# Example extractors config — copy to your own file and edit, then point the indexer at it via the
# `--extractors-config <path>` flag (the docker setup mounts it as `extractors.yaml`).
#
# Each entry under `extractors:` configures one Substreams-backed extractor. The optional top-level
# `chains:` section defines custom (non-built-in) chains by name so that `chain: <name>` resolves
# below; the indexer reads this section directly. Other tooling (e.g. tycho-execution) can point
# `TYCHO_CHAIN_CONFIG` at this same file (default `./chain.yaml`) to share the definitions.

extractors:
  # Native (`Custom`) extractor on a built-in chain — the common case.
  uniswap_v3:
    name: "uniswap_v3"                # unique extractor id; also used as the protocol system name
    chain: "ethereum"                 # built-in chain name, or a custom chain from `chains:` below
    implementation_type: "Custom"     # "Custom" (native substreams) or "Vm" (VM-simulated)
    sync_batch_size: 1000             # number of blocks fetched per Substreams batch
    start_block: 12369621             # first block to index
    # stop_block: 13000000            # optional: last block to index (omit to follow the chain tip)
    protocol_types:
      - name: "uniswap_v3_pool"       # protocol type stored on each component
        financial_type: "Swap"        # Swap | Psm | Debt | Leverage
    spkg: "substreams/ethereum-uniswap-v3/ethereum-uniswap-v3-logs-only-0.1.1.spkg"
    module_name: "map_protocol_changes"  # the Substreams module that emits BlockChanges

  # VM extractor with the optional fields exercised.
  vm:balancer_v2:
    name: "vm:balancer_v2"
    chain: "ethereum"
    implementation_type: "Vm"
    sync_batch_size: 1000
    start_block: 12272146
    protocol_types:
      - name: "balancer_v2_pool"
        financial_type: "Swap"
    spkg: "substreams/ethereum-balancer-v2/ethereum-balancer-v2-v0.2.4.spkg"
    module_name: "map_protocol_changes"
    # initialized_accounts: ["0xba12222222228d8ba445958a75a0704d566bf2c8"]  # contracts to preload
    # initialized_accounts_block: 12272146   # block at which the above accounts are read
    # post_processor: "ignore_self_balances" # named hook applied to each block's changes
    # dci_plugin:                            # optional Dynamic Contract Indexer
    #   type: "rpc"                          # "rpc" or "uniswap_v4_hooks"
    #   # pool_manager_address: "0x..."      # required only for "uniswap_v4_hooks"

  # Extractor on a custom chain. `chain: tempo` resolves against the `chains:` entry below.
  tempo_uniswap_v3:
    name: "tempo_uniswap_v3"
    chain: "tempo"
    implementation_type: "Custom"
    sync_batch_size: 1000
    start_block: 0
    protocol_types:
      - name: "uniswap_v3_pool"
        financial_type: "Swap"
    spkg: "substreams/tempo-uniswap-v3/tempo-uniswap-v3-v0.1.0.spkg"
    module_name: "map_protocol_changes"

# Custom chains referenced above. Built-in chains (ethereum, base, unichain, …) need no entry here.
chains:
  - name: tempo                       # the value used as `chain:` on extractors above
    chain_id: <tempo chain id>        # EVM chain id
    block_time_secs: 1
    native:                           # native gas token
      address: "0x0000000000000000000000000000000000000000"
      symbol: "ETH"
      decimals: 18
    wrapped_native:                   # wrapped native token (e.g. WETH)
      address: "0x0000000000000000000000000000000000000000"
      symbol: "WETH"
      decimals: 18
    default_tvl_thresholds:           # TVL gates (in native token units) for component tracking
      low: 1000
      medium: 10000
