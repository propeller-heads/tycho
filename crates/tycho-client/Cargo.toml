[package]
name = "tycho-client"
version.workspace = true
edition.workspace = true
description = "A library and CLI tool for querying and accessing liquidity data from Tycho indexer."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "tycho-client"
path = "src/main.rs"

[dependencies]
tycho-common.workspace = true
futures03.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
hex.workspace = true
tracing-appender.workspace = true
lru.workspace = true
rand.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { version = "0.12.7", features = ["json", "zstd"] }
tracing-subscriber = { version = "0.3.17", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
] }
hyper = "0.14.27"
backoff = { version = "0.4.0", features = ["tokio", "futures"] }
time = "0.3.41"
zstd = "0.13"

[dev-dependencies]
pretty_assertions.workspace = true
# `test-util` enables tokio's paused clock, so retry-backoff tests assert on virtual time instead
# of sleeping.
tokio = { workspace = true, features = ["test-util"] }
rstest.workspace = true
mockall.workspace = true
mockito.workspace = true
tracing-subscriber = "0.3.17"
test-log = { version = "0.2.14", features = ["trace"] }
