[package]
name = "tycho-ethereum"
version.workspace = true
edition.workspace = true
description = "Ethereum specific implementation of core tycho traits"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
license-file.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
tycho-common.workspace = true
chrono.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
futures = "0.3"
backoff = { version = "0.4.0", features = ["tokio"], default-features = false }
num-bigint = { version = "0.4", features = ["serde"] }
serde_with = "3.16.1"

# Required dependencies
alloy = { workspace = true, default-features = false, features = [
    "reqwest-default-tls",
    "rpc-client",
    "json-rpc",
    "sol-types",
    "rpc-types",
    "rpc-types-trace",
    "rpc-types-debug",
    "providers",
] }

[build-dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
# The versions already in Cargo.lock. Upgrading them can change every source digest once (see
# build/source_digest.rs).
syn = { version = "2.0.117", features = ["full", "visit-mut"] }
quote = "1.0.40"
proc-macro2 = "1.0.101"

[dev-dependencies]
pretty_assertions.workspace = true
mockito.workspace = true
rstest.workspace = true
tracing-test = "0.2.5"
# For the tests of build/source_digest.rs, which src/lib.rs compiles in test builds.
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
syn = { version = "2.0.117", features = ["full", "visit-mut"] }
quote = "1.0.40"
proc-macro2 = "1.0.101"

[[example]]
name = "run-analysis"
