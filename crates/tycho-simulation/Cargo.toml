[package]
name = "tycho-simulation"
version.workspace = true
edition.workspace = true
description = "Provides tools for interacting with protocol states, calculating spot prices, and quoting token swaps."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
readme = "README.md"
rust-version = "1.91.0"
exclude = [
    "benches/fixtures",
    "tests/assets",
]

[package.metadata.cargo-machete]
ignored = ["ruint"]

[dependencies]
# Serialization/Deserialization
bytes = { workspace = true, optional = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, optional = true }
toml = { workspace = true }
typetag = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

# Error handling
thiserror = { workspace = true }

# Async & concurrency
async-stream = { workspace = true, optional = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

# Logging & Tracing
tracing = { workspace = true }

# Utility
dotenv = { workspace = true }
enum_delegate = "0.2.0"
itertools = { workspace = true }
rustc-hash = "2.1.2"
lunarbase-pmm-math = "0.2.4"
num-traits = { workspace = true }

# Used by the vendored Curve math/adapter modules (src/evm/protocol/curve/{math,adapter}).
alloy-primitives = { version = "1.5", features = ["serde"], optional = true }

# Enum utilities
strum_macros = { workspace = true }

# Tycho dependencies
tycho-client = { workspace = true }
tycho-common = { workspace = true }
tycho-ethereum = { workspace = true }

# EVM dependencies
alloy = { workspace = true, features = [
    "sol-types",
    "rand",
    "dyn-abi",
    "json-abi",
    "eip712"
], optional = true }
foundry-block-explorers = { version = "0.22.0", optional = true }
num-bigint = { workspace = true }
revm = { version = "29.0.1", features = [
    "alloydb",
    "serde",
    "optional_eip3607",
], optional = true }
revm-inspectors = { version = "0.30.0", features = ["serde"], optional = true }
ruint = { workspace = true }

# Ekubo
ekubo_sdk = { version = "3", features = ["evm", "serde"] }
evm_ekubo_sdk = { version = "0.6.5", features = ["serde"] }

# Balancer V3 — Balancer's own reference maths (MIT), used by the native decoder.
balancer-maths-rust = "0.5.0"

# rfq
alloy-chains = "0.2.37"
async-trait = { workspace = true, optional = true }
derive_more = { workspace = true }
hex-literal = { workspace = true }
http = { version = "1.0", optional = true }
prost = { version = "0.13", optional = true }
reqwest = { version = "0.12.22", default-features = false, features = [
    "native-tls",
], optional = true }
tokio-tungstenite = { version = "0.28.0", features = [
    "native-tls",
], optional = true }

[dev-dependencies]
tycho-execution = { workspace = true }
tokio-test = "0.4.4"
approx = "0.5.1"
rstest = "0.23.0"
rstest_reuse = "0.7.0"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tempfile = "3.13.0"
mockall = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
unicode-width = "0.1.13"
tracing-appender = { workspace = true }
dialoguer = "0.10.4"
criterion = "0.8.2"

[features]
default = ["evm", "book-feeds", "price-level-stream"]
network_tests = []
price-level-stream = ["dep:async-stream", "dep:tokio-tungstenite"]
evm = [
    "dep:foundry-block-explorers",
    "dep:revm",
    "dep:revm-inspectors",
    "dep:alloy",
    "dep:reqwest",
    "dep:alloy-primitives",
    "dep:tokio-tungstenite",
]
# The off-chain book feeds and everything they are built from: the transport loops in
# `snapshot_feed`, the shared `book` layer, and the `rfq` and `pamm` provider families. The
# `SnapshotFeed` trait itself is unconditional — it is the contract, not a feed.
book-feeds = [
    # `bytes_to_address` and the providers' `alloy` address types.
    "evm",
    "dep:async-stream",
    "dep:bytes",
    "dep:reqwest",
    "dep:async-trait",
    "dep:tokio-tungstenite",
    "dep:http",
    "dep:prost",
    "dep:serde_with",
]

[[bench]]
name = "get_amount_out"
harness = false

[[bench]]
name = "concurrency_throughput"
harness = false
