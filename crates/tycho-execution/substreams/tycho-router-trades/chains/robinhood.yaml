specVersion: v0.1.0
package:
  name: tycho_router_trades
  version: v0.1.0
  url: https://github.com/propeller-heads/tycho/tree/main/crates/tycho-execution/substreams

imports:
  database_change: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg

protobuf:
  files:
    - tycho/router/v1/trades.proto
  importPaths:
    - ../proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/tycho_router_trades.wasm

modules:
  - name: map_fee_config_events
    kind: map
    initialBlock: 24417223
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.router.v1.FeeConfigEvents

  - name: store_fee_config
    kind: store
    initialBlock: 24417223
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_fee_config_events

  - name: map_trades
    kind: map
    initialBlock: 24417223
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_fee_config
    output:
      type: proto:tycho.router.v1.Trades

  - name: db_out
    kind: map
    initialBlock: 24417223
    inputs:
      - map: map_trades
      - map: map_fee_config_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: robinhood

params:
  map_fee_config_events: chain=robinhood&routers=0x345e48768a65ae596ac6a2aee71202753c4866f5:v3_1,0x09215a470bd585e59eb3f4b612fbd2678131ff9e:v3_1&fee_calculators=0x345e48768a65ae596ac6a2aee71202753c4866f5:0xd16dbe64e5688c5771e52d530e0c21b32901f141,0x09215a470bd585e59eb3f4b612fbd2678131ff9e:0x0dd35e98aa40b4b75a8aa4950fd761b23de12854
  map_trades: chain=robinhood&routers=0x345e48768a65ae596ac6a2aee71202753c4866f5:v3_1,0x09215a470bd585e59eb3f4b612fbd2678131ff9e:v3_1&fee_calculators=0x345e48768a65ae596ac6a2aee71202753c4866f5:0xd16dbe64e5688c5771e52d530e0c21b32901f141,0x09215a470bd585e59eb3f4b612fbd2678131ff9e:0x0dd35e98aa40b4b75a8aa4950fd761b23de12854

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "../../schema.sql"
    engine: postgres
