syntax = "proto3";

package tycho.router.v1;

// All router trades found in one block.
message Trades {
  repeated Trade trades = 1;
  repeated RouterCallError errors = 2;
}

// A selector-matched router call that could not be decoded safely.
message RouterCallError {
  string chain = 1;
  uint64 block_number = 2;
  uint64 block_timestamp = 3;
  bytes tx_hash = 4;
  uint32 tx_index = 5;
  uint32 call_index = 6;
  bytes router = 7;
  string router_version = 8;
  // Decode stage: "calldata", "amount_out" or "hops".
  string stage = 9;
  string error = 10;
  bool tx_success = 11;
  bool call_success = 12;
  // Whether the chain kept the state changes of the call. See Trade.state_committed.
  bool state_committed = 13;
}

// One call into a TychoRouter swap entry point (successful or reverted).
message Trade {
  string chain = 1;
  uint64 block_number = 2;
  uint64 block_timestamp = 3;
  bytes tx_hash = 4;
  uint32 tx_index = 5;
  // Index of the router call inside the transaction trace; unique per tx.
  uint32 call_index = 6;
  // True when the enclosing transaction succeeded.
  bool tx_success = 7;
  // True when the router call itself did not revert or fail.
  bool call_success = 8;

  bytes router = 9;
  // Router ABI generation: "v2", "v3_0" or "v3_1".
  string router_version = 10;
  // "single", "sequential" or "split".
  string strategy = 11;
  // How user funds enter the router: "transfer_from", "permit2", "vault" or "none".
  string funding = 12;

  bytes eoa = 13;
  bytes msg_sender = 14;
  bytes receiver = 15;
  bytes token_in = 16;
  bytes token_out = 17;
  // Decimal strings; empty when not present for this router version / outcome.
  string amount_in = 18;
  string expected_amount_out = 19;
  string min_amount_out = 20;
  // Settled output amount after fees, decoded from the call return value.
  string amount_out = 21;
  string native_value = 22;
  uint64 gas_used = 23;

  // Revert data: 4-byte selector (hex) and the resolved error name / reason string.
  string revert_selector = 24;
  string revert_reason = 25;

  ClientFee client_fee = 26;
  RouterFeeConfig router_fee_config = 27;
  repeated FeeTaken fees_taken = 28;

  uint32 n_tokens = 29;
  repeated Hop hops = 30;
  // Trailing calldata appended after the ABI-encoded arguments.
  bytes watermark = 31;
  // V2 only.
  bool wrap_eth = 32;
  bool unwrap_eth = 33;
  // Whether the chain kept the state changes of the call.
  //
  // A call can return normally and still have every state change it made thrown away, because
  // an ancestor call reverted afterwards. A caller quoting the router on chain does exactly
  // that: it calls the router, reads the return value, then reverts. Such a call carries
  // tx_success and call_success like a fill, so this is the only field that separates the two.
  bool state_committed = 34;
}

// One executor invocation inside a trade.
message Hop {
  uint32 index = 1;
  bytes executor = 2;
  // 3 was protocol_systems, which the `executors` table now resolves from the address at query
  // time. See executors.sql.
  reserved 3;
  // Split swaps only: indices into the trade's token array and the raw uint24 split
  // (0 means "remainder").
  uint32 token_in_index = 4;
  uint32 token_out_index = 5;
  uint32 split = 6;
  bytes protocol_data = 7;
}

// ClientFeeParams passed to V3 routers.
message ClientFee {
  uint64 fee_bps = 1;
  bytes receiver = 2;
  string max_client_contribution = 3;
  // uint256 decimal string; the encoder uses uint256 max for "no deadline".
  string deadline = 4;
  bool has_signature = 5;
}

// Router fee configuration in effect for this trade, resolved from the fee store.
message RouterFeeConfig {
  bytes fee_calculator = 1;
  uint64 fee_on_output_bps = 2;
  uint64 fee_on_client_fee_bps = 3;
  bool custom_fee_on_output = 4;
  bool custom_fee_on_client_fee = 5;
  bool positive_slippage_enabled = 6;
  // Denominator of the bps values: 10000 for v3_0, 100000000 for v3_1.
  uint64 bps_scale = 7;
  // Whether this trade's client is exempt from positive slippage capture. The client is the
  // signed clientFeeReceiver, or tx.origin when that is zero, the same resolution the
  // FeeCalculator does. Only the calculator generation that has exemptions can set it.
  bool positive_slippage_exempt = 8;
}

// One recipient of the FeesTaken event.
message FeeTaken {
  bytes recipient = 1;
  string amount = 2;
  // Contract array position: "router" first, then "client".
  string role = 3;
  // The credited token, from the event rather than the calldata, so a vault balance built on
  // this does not depend on the swap decoder.
  bytes token = 4;
}

// Fee configuration changes found in one block.
message FeeConfigEvents {
  repeated FeeConfigEvent events = 1;
}

// One admin event on a FeeCalculator or a fee-calculator rotation on a router.
message FeeConfigEvent {
  string chain = 1;
  uint64 block_number = 2;
  uint64 block_timestamp = 3;
  bytes tx_hash = 4;
  uint32 log_index = 5;
  uint64 ordinal = 6;
  bytes emitter = 7;
  // Event name, e.g. "RouterFeeOnOutputUpdated", "FeeCalculatorActivated".
  string event = 8;
  // Client address for Custom* events; empty otherwise.
  bytes client = 9;
  // Decimal / hex string representation of the old and new values.
  string old_value = 10;
  string new_value = 11;
  // Denominator of the bps values this emitter uses, when the event gives its generation away;
  // 0 otherwise. The two FeeCalculator generations widened the bps arguments from uint16 to
  // uint32, so an event that carries one has a different topic in each.
  uint64 bps_scale = 12;
}

// Every ERC-6909 Transfer a router emitted in one block.
//
// The router keeps a vault of internal token balances. It credits a fee recipient there instead
// of transferring, so router revenue accrues as a vault balance until someone withdraws it.
//
// Fee credits are NOT in here: the router mints those without an event to save gas, and reports
// them through FeesTaken instead (see FeeTaken). A balance therefore needs both sources.
message VaultTransfers {
  repeated VaultTransfer transfers = 1;
}

// One ERC-6909 Transfer: a deposit, a withdrawal, or a move between two owners.
message VaultTransfer {
  string chain = 1;
  uint64 block_number = 2;
  uint64 block_timestamp = 3;
  bytes tx_hash = 4;
  uint32 log_index = 5;
  // The router holding the vault. Each router has its own, so a balance is per router.
  bytes router = 6;
  // msg.sender of the call that moved the balance. The owner of an operator-driven move.
  bytes caller = 7;
  // Debited owner; empty on a credit (mint).
  bytes sender = 8;
  // Credited owner; empty on a debit (burn).
  bytes receiver = 9;
  // The ERC-6909 id, which the router derives from the token address.
  bytes token = 10;
  string amount = 11;
  // "credit" (minted), "debit" (burned) or "transfer" (between two owners).
  string kind = 12;
}
