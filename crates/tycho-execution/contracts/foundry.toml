[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
evm_version = 'osaka'
optimizer = true
optimizer_runs = 200
via_ir = true
# Pin solc and drop the metadata hash so the runtime bytecode fixtures
# (protocols/testing/fixtures) are reproducible across Foundry versions.
solc = '0.8.33'
bytecode_hash = 'none'
fs_permissions = [
    { access = "read", path = "./test/assets" },
    { access = "write", path = "./test" },
    # `test/RuntimeBytecodeFixtures.sol` reads the constructor arguments the executors deploy
    # with; the test checks the runtime bytecode fixtures protocol-testing plants and
    # `script/WriteRuntimeBytecodeFixtures.s.sol` writes them.
    { access = "read", path = "../config/executor_deployments.json" },
    # `test/protocols/Pendle.t.sol` replays the swaps the simulation's parity test quotes.
    { access = "read", path = "../../tycho-simulation/src/evm/protocol/pendle/tests/fixtures/executed_swaps.json" },
    # It also reads the per-edge gas the simulation charges and checks it against the chain.
    { access = "read", path = "../../tycho-simulation/src/evm/protocol/pendle/state.rs" },
    { access = "read-write", path = "../../../protocols/testing/fixtures" },
]

[profile.production]
src = 'src'
out = 'out'
libs = ['lib']
evm_version = 'osaka'
optimizer = true
optimizer_runs = 1000
via_ir = true

[rpc_endpoints]
mainnet = "${RPC_URL}"
# Chain names from config/executor_deployments.json double as aliases, so the fixtures can fork
# the chain an executor is deployed on by that name.
ethereum = "${RPC_URL}"
base = "${BASE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 80
