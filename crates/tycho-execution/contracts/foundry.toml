[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
# Remappings come from remappings.txt alone. Auto-detection scopes each dependency's
# nested libraries to it with context remappings (`lib/<dep>/:<prefix>=...`), and the
# Hardhat deploy scripts break on those: @nomicfoundation/hardhat-foundry reads
# `forge remappings` and rejects any context. Re-enable it once deployments have moved
# off Hardhat.
auto_detect_remappings = false
evm_version = 'osaka'
optimizer = true
optimizer_runs = 200
via_ir = true
# Pin solc and drop the metadata hash so the runtime bytecode fixtures
# (protocols/testing/fixtures) are reproducible across Foundry versions.
solc = '0.8.33'
bytecode_hash = 'none'
fs_permissions = [
    { access = "read", path = "./test/assets" },
    { access = "write", path = "./test" },
    # `test/RuntimeBytecodeFixtures.sol` reads the constructor arguments the executors deploy
    # with; the test checks the runtime bytecode fixtures protocol-testing plants and
    # `script/WriteRuntimeBytecodeFixtures.s.sol` writes them.
    { access = "read", path = "../config/executor_deployments.json" },
    { access = "read-write", path = "../../../protocols/testing/fixtures" },
]

[profile.production]
src = 'src'
out = 'out'
libs = ['lib']
evm_version = 'osaka'
optimizer = true
optimizer_runs = 1000
via_ir = true

[rpc_endpoints]
mainnet = "${RPC_URL}"
# Chain names from config/executor_deployments.json double as aliases, so the fixtures can fork
# the chain an executor is deployed on by that name.
ethereum = "${RPC_URL}"
base = "${BASE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 80

# forge lint is the primary linter. Slither (slither.config.json, slither.md) runs the checks
# excluded below and those forge does not have; a check runs in both only where the two catch
# different cases. The split comes from comparing forge 1.9.0 with Slither 0.11.6 on src/.
[lint]
# An empty list turns the severity filter off, so every lint runs unless exclude_lints names it.
severity = []
exclude_lints = [
    # Owned by Slither, whose detectors handle this codebase better:
    "unused-return",              # Misses calls with `{value: ...}` options.
    "reentrancy-events",          # Does not recognise nonReentrant guards.
    "reentrancy-eth",             # Does not recognise nonReentrant guards.
    "reentrancy-no-eth",          # Does not recognise nonReentrant guards.
    "controlled-delegatecall",    # Distrusts immutable targets, like an executor's own address.
    "locked-ether",               # Follows the bodies of external callees and stops at assembly.
    "boolean-cst",                # Reports the bool literals in ternary tuple arms.
    "unchecked-call",             # Passes a success value that is bound but never read.
    "erc20-unchecked-transfer",   # Passes a success value that is bound but never read.
    "incorrect-erc20-interface",  # Only checks contracts that inherit a base named (I)ERC20.
    "incorrect-erc721-interface", # Only checks contracts that inherit a base named (I)ERC721.
    "encode-packed-collision",    # Reports any two dynamic arguments, not only adjacent ones.

    # Owned by Slither's naming-convention; the codebase uses mixedCase immutables:
    "mixed-case-function",            # Function names.
    "mixed-case-variable",            # Variable and parameter names.
    "pascal-case-struct",             # Struct names.
    "screaming-snake-case-const",     # Constant names.
    "screaming-snake-case-immutable", # Immutable names; this rule conflicts with Slither's.

    # Off for this codebase:
    "require-revert-in-loop",   # Rejecting a whole call when one element is invalid is intended.
    "calls-loop",               # Calling out per element is intended; one failed call reverts the whole call.
    "block-timestamp",          # Timestamps only gate deadlines and timelocks; seconds of drift are harmless.
    "unwrapped-modifier-logic", # Under via-IR, wrapping grows EkuboExecutor by 115 B and ~340 gas/swap (on c29ab76f7).
    "modifier-used-only-once",  # Access checks are modifiers however many functions use them.
    "asm-keccak256",            # abi.encode follows a struct's fields; a hand-listed library hash would not.
    "unsafe-typecast",          # Off until each of its 54 casts in src/ is checked against its range.
    "unsafe-cheatcode",         # Tests read fixture files on purpose; fs_permissions limits the paths.
]

[lint.lint_specific]
# An executor or router file also declares the protocol interfaces and libraries it uses.
multi_contract_file_exceptions = ["interface", "library"]
