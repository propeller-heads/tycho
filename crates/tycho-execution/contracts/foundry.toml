[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
evm_version = 'osaka'
optimizer = true
optimizer_runs = 200
via_ir = true
# Pin solc and drop the metadata hash so the runtime bytecode fixtures
# (protocols/testing/fixtures) are reproducible across Foundry versions.
solc = '0.8.33'
bytecode_hash = 'none'
fs_permissions = [
    # `loadCallDataFromFile` (test/TestUtils.sol) reads the calldata fixtures that the rust
    # encoding tests generate.
    { access = "read", path = "./test/assets" },
    # `ExecutorAddresses.t.sol` reads the executor addresses the rust encoders are configured
    # with, to check them against the ones the test setup deploys.
    { access = "read", path = "../config/test_executor_addresses.json" },
]

[profile.production]
src = 'src'
out = 'out'
libs = ['lib']
evm_version = 'osaka'
optimizer = true
optimizer_runs = 1000
via_ir = true

[rpc_endpoints]
mainnet = "${RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 80
