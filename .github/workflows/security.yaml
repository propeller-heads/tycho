name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update --profile minimal

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          version: 2026.10.25
          install_args: github:rustsec/rustsec jq

      - name: Run cargo audit
        run: |

          cargo audit --json > audit.json || true

          COUNT=$(jq '.vulnerabilities.count' audit.json)

          if [ "$COUNT" -ne 0 ]; then
            echo "=============================="
            echo "CARGO AUDIT FAILED ($COUNT issues)"
            echo "=============================="

            jq -r '
              .vulnerabilities.list[] |
              "[" + (.advisory.severity // "unknown" | ascii_upcase) + "] " +
              "ID: " + .advisory.id + " | " +
              "Crate: " + .package.name + " | " +
              "Version: " + .package.version + " | " +
              "Error: " + .advisory.title
            ' audit.json

            exit 1
          else
            echo "cargo audit passed — no vulnerabilities found"
          fi

  detect-unused-dependencies:
    name: Cargo machete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          version: 2026.10.25
          install_args: github:bnjbvr/cargo-machete

      - name: Machete
        run: cargo-machete
