name: Foundry CI

on:
  pull_request_target:
  # No path filter here. Path filtering is handled inside the `changes` job so
  # that the skip-* jobs below always execute on every PR. GitHub branch
  # protection requires a check to appear (pass or skip) on each commit — if
  # the workflow never runs, required checks remain pending and block the PR.
  push:
    branches: [ main ]
    paths:
      - 'crates/tycho-execution/contracts/**'
      - 'protocols/adapter-integration/evm/**'
      - 'crates/tycho-simulation/token-proxy-contracts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether any Foundry-relevant paths changed in the PR.
  # Real CI jobs run only when this outputs foundry == 'true', or when triggered
  # outside a PR (push/workflow_dispatch). The matching skip-* jobs run otherwise,
  # producing green checks so branch protection rules that require
  # "Foundry CI / <job-name>" are satisfied on every PR.
  changes:
    name: Detect Foundry changes
    runs-on: ubuntu-latest
    # continue-on-error so non-PR triggers (push, workflow_dispatch) don't block
    # dependent jobs if changed-files has no base ref to compare against.
    continue-on-error: true
    outputs:
      foundry: ${{ steps.filter.outputs.any_changed }}
      bytecode: ${{ steps.filter-bytecode.outputs.any_changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        id: filter
        with:
          files: |
            crates/tycho-execution/contracts/**
            protocols/adapter-integration/evm/**
            crates/tycho-simulation/token-proxy-contracts/**
            .github/workflows/ci-foundry.yaml

      # Inputs to the protocol-testing runtime bytecode fixtures.
      - uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        id: filter-bytecode
        with:
          files: |
            crates/tycho-execution/contracts/src/**
            crates/tycho-execution/config/executor_deployments.json
            protocols/testing/fixtures/**
            protocols/testing/scripts/update_runtime_bytecode.sh

  forge-test:
    name: Forge build, fmt, test (${{ matrix.project.path }})
    needs: [ changes ]
    if: needs.changes.outputs.foundry == 'true' || github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # forge test runs fork-controlled Solidity (and can shell out via ffi) with
    # RPC secrets in scope; gate fork PRs behind required-reviewer approval.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    strategy:
      matrix:
        project:
          - path: crates/tycho-execution/contracts
          - path: protocols/adapter-integration/evm
          - path: crates/tycho-simulation/token-proxy-contracts
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    env:
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      RPC_URL: ${{ secrets.ETH_RPC_URL }}
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL_ARCHIVE }}
      UNICHAIN_RPC_URL: ${{ secrets.UNICHAIN_RPC_URL_ARCHIVE }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL_ARCHIVE }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL_ARCHIVE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Checkout submodules (shallow, project-scoped)
        run: |
          git config --file .gitmodules --get-regexp path \
            | awk '{print $2}' \
            | grep "^${{ matrix.project.path }}/" \
            | xargs -r git submodule update --init --depth 1 --recursive --

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c  # v1

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv

      - name: Gas snapshot
        run: NO_COLOR=1 forge snapshot >> "$GITHUB_STEP_SUMMARY"
        if: matrix.project.path == 'crates/tycho-execution/contracts'

  # One skip job per matrix entry so each check name matches exactly what branch
  # protection requires ("Foundry CI / Forge build, fmt, test (<path>)").
  forge-test-skip-execution:
    name: Forge build, fmt, test (crates/tycho-execution/contracts)
    needs: [ changes ]
    if: needs.changes.outputs.foundry != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Foundry changes detected, skipping forge-test"

  forge-test-skip-adapter:
    name: Forge build, fmt, test (protocols/adapter-integration/evm)
    needs: [ changes ]
    if: needs.changes.outputs.foundry != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Foundry changes detected, skipping forge-test"

  forge-test-skip-token-proxy:
    name: Forge build, fmt, test (crates/tycho-simulation/token-proxy-contracts)
    needs: [ changes ]
    if: needs.changes.outputs.foundry != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Foundry changes detected, skipping forge-test"

  slither:
    name: Slither static analysis
    needs: [ changes ]
    if: needs.changes.outputs.foundry == 'true' || github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets here, but it compiles fork code; gate for consistency.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Checkout submodules (shallow)
        run: |
          git config --file .gitmodules --get-regexp path \
            | awk '{print $2}' \
            | grep "^crates/tycho-execution/contracts/" \
            | xargs -r git submodule update --init --depth 1 --recursive --

      - uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8  # v0.4.1
        with:
          target: 'crates/tycho-execution/contracts/'
          slither-args: '--filter-paths crates/tycho-execution/contracts/lib/ --exclude unindexed-event-address'

  slither-skip:
    name: Slither static analysis
    needs: [ changes ]
    if: needs.changes.outputs.foundry != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Foundry changes detected, skipping Slither"

  # Verifies the protocol-testing runtime bytecode fixtures still match the
  # contracts + executor_deployments.json. Only runs on PRs targeting main that
  # touch a bytecode input, so contract changes can't silently leave the
  # fixtures stale. Regenerate with protocols/testing/scripts/update_runtime_bytecode.sh.
  runtime-bytecode-check:
    name: Runtime bytecode fixtures up to date
    needs: [ changes ]
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && needs.changes.outputs.bytecode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    env:
      RPC_URL: ${{ secrets.ETH_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Checkout contracts submodules (shallow)
        run: |
          git config --file .gitmodules --get-regexp path \
            | awk '{print $2}' \
            | grep "^crates/tycho-execution/contracts/" \
            | xargs -r git submodule update --init --depth 1 --recursive --

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c  # v1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22

      - name: Install contract deps
        working-directory: crates/tycho-execution/contracts
        run: npm ci

      - name: Check runtime bytecode fixtures are up to date
        run: ./protocols/testing/scripts/update_runtime_bytecode.sh --check
