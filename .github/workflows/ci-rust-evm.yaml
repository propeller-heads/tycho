name: Rust CI

on:
  pull_request_target:
    # This job needs RPC secrets, so fork PRs run here after maintainer approval.
    # The regular Rust CI workflow stays on pull_request for non-secret checks.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'protocols/testing/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-rust-evm.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect Rust EVM changes
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      rust: ${{ steps.filter.outputs.any_changed }}
      price-level-stream: ${{ steps.price-level-stream.outputs.any_changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        id: filter
        with:
          files: |
            crates/**
            protocols/testing/**
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .github/workflows/ci-rust-evm.yaml

      # The pAMM simulation overrides test dials the live Titan sockets and makes real RPC calls,
      # so it runs only when the code it covers changes, or on a manual dispatch.
      - uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        id: price-level-stream
        with:
          files: |
            crates/tycho-simulation/src/price_level_stream/**
            crates/tycho-test/src/execution/**
            crates/tycho-integration-test/tests/pamm_simulation_overrides.rs

  test-evm:
    name: EVM tests (requires RPC)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs fork code (cargo build/test) with RPC secrets in scope; gate fork PRs
    # behind required-reviewer approval. Internal-branch PRs run without approval.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@aba36d755ec7ca22d38b12111787c26115943952  # v2.68.12
        with:
          tool: cargo-nextest

      - name: Run EVM / fork tests
        # Exclusions:
        # - test_permit: requires a local anvil fork; enabled by --all-features via fork-tests feature
        # - tycho-simulation evm tests: require pre-recorded JSON snapshots not committed to the repo
        run: |
          cargo nextest run --workspace --all-features --locked \
            -E '(test(evm) | test(fork) | (package(protocol-testing) and (test(rpc) | test(test_token_balance_validation)))) and not (package(tycho-execution) and test(test_permit)) and not package(tycho-simulation)'
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          RPC_URL: ${{ secrets.ETH_RPC_URL }}
          RUSTFLAGS: -Dwarnings

  test-evm-skip:
    name: EVM tests (requires RPC)
    needs: [changes]
    if: needs.changes.outputs.rust != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust changes detected, skipping EVM tests"

  test-pamm-overrides:
    name: pAMM simulation overrides (live)
    needs: [changes]
    if: needs.changes.outputs.price-level-stream == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same reason as test-evm: this runs fork code (cargo build/test) with an RPC secret in scope,
    # so a fork PR waits on required-reviewer approval before the job starts. Internal-branch PRs
    # run without approval. This is why the job lives here rather than in ci-rust.yaml, which runs
    # on `pull_request` and so hands a fork no secret at all — the test would skip itself and the
    # check would pass green without testing anything.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          cache-on-failure: true

      # Captures live pAMM quotes, then simulates each encoded swap on the parent of the block it
      # targets, with and without the quote's own overrides. It fails when a quote's own overrides
      # revert or miss the quoted amount, or when the stream served quotes and none carried
      # overrides. It passes with a `::warning::` when Titan serves no quote, or when none of the
      # captured quotes can be checked against the chain: the RPC returns none of the quoted
      # blocks, or no simulation runs.
      - name: Simulate live pAMM quotes with their overrides
        run: |
          cargo test -p tycho-integration-test --test pamm_simulation_overrides --locked \
            -- --ignored --nocapture
        env:
          RPC_URL: ${{ secrets.ETH_RPC_URL }}

  test-pamm-overrides-skip:
    name: pAMM simulation overrides (live)
    needs: [changes]
    if: needs.changes.outputs.price-level-stream != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No price level stream changes detected, skipping the pAMM override check"
