name: Router Trades CI

on:
  pull_request:
    paths:
      - 'crates/tycho-execution/substreams/**'
      - 'crates/tycho-execution/config/executor_addresses.json'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/ci-router-trades.yaml'
  push:
    branches: [main]
    paths:
      - 'crates/tycho-execution/substreams/**'
      - 'crates/tycho-execution/config/executor_addresses.json'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/ci-router-trades.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/tycho-execution/substreams
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update --profile minimal

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          version: 2026.10.25
          install_args: python

      - name: Install the fmt and clippy nightly from mise.toml
        run: rustup toolchain install --no-self-update "$RUST_NIGHTLY" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          cache-on-failure: true
          workspaces: crates/tycho-execution/substreams

      - name: Unit tests
        run: make test

      - name: Manifest filters
        run: make check-manifests

      - name: Executor names
        run: make check-executors

      - name: Formatting
        run: cargo +"$RUST_NIGHTLY" fmt -- --check

      - name: Clippy
        run: cargo +"$RUST_NIGHTLY" clippy --all --all-features --all-targets -- -D warnings

      - name: WASM build
        run: make build

      - name: Executor table integration
        run: make test-executors

      - name: Views integration
        run: make test-views

      - name: Pricing integration and outage isolation
        run: |
          make test-pricing
          ./scripts/test_pricing.sh --outage-check
