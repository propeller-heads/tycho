name: Python Client CI

on:
  pull_request:
    paths:
      - 'crates/tycho-client-py/**'
      - 'crates/tycho-client/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/ci-python-client.yaml'
  push:
    branches: [main]
    paths:
      - 'crates/tycho-client-py/**'
      - 'crates/tycho-client/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/ci-python-client.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/tycho-client-py
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          version: 2026.10.25
          install_args: uv

      # The pinned pydantic 1.8 does not import on the Python in mise.toml.
      - name: Install the pinned dependencies
        run: |
          uv venv -p 3.12
          uv pip install -r pyproject.toml --extra testing

      # The tests do not use the bundled CLI binary, so they run from source without a maturin build.
      - name: Tests
        run: PYTHONPATH=python .venv/bin/python -m pytest python/tests/
