name: Protocol Selection Tests

on:
  pull_request:
    paths:
      - 'protocols/testing/**'
      - '.github/workflows/ci-substreams-integration.yaml'
      - '.github/workflows/ci-protocol-selection.yaml'
      - '.github/actions/substreams-docker-single/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # Deliberately no cache, secrets or base-branch execution context for PR Python code.
      - run: python3 -m unittest discover -s protocols/testing/scripts -p 'test_*.py'
