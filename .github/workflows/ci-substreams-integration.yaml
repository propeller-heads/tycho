name: Substreams Integration Tests

on:
  workflow_dispatch:
    inputs:
      protocols:
        description: 'Space-separated list of protocols to test (leave empty for all)'
        required: false
        default: ''
        type: string
  pull_request_target:
    paths:
      - 'protocols/substreams/**'
      - 'protocols/testing/**'
      - '.github/workflows/ci-substreams-integration.yaml'
      - '.github/actions/substreams-docker-single/**'

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      target-protocols: ${{ steps.selection.outputs.protocols }}
      protocols-matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      # Selection runs in the base-branch context. Only trusted code may execute here;
      # the candidate checkout supplies JSON, filenames and git history, never Python imports.
      - name: Checkout trusted selection tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted

      - name: Checkout candidate data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate

      - name: Select protocol tests
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROTOCOLS: ${{ inputs.protocols }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_PROTOCOLS" ]]; then
              MODE=(--protocols "$INPUT_PROTOCOLS")
            else
              MODE=(--all)
            fi
          else
            MODE=(--base "$BASE_SHA")
          fi
          python3 -E -s trusted/protocols/testing/scripts/select_protocols.py \
            --root "$GITHUB_WORKSPACE/candidate" "${MODE[@]}" \
            --github-output "$GITHUB_OUTPUT"

  build-images:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.target-protocols != ''
    # Fork PRs run unreviewed code with secrets in scope; gate them behind a
    # required-reviewer environment. Internal-branch PRs (trusted collaborators)
    # resolve to no environment and run without approval.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate cache key
        id: cache-key
        run: |
          KEY="docker-images-${{ hashFiles('protocols/testing/postgres.Dockerfile', 'protocols/testing/run.Dockerfile') }}-${{ github.sha }}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Cache Docker layers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and cache DB image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache \
            -f protocols/testing/postgres.Dockerfile \
            -t protocol-testing-db:latest \
            --load .
          docker save protocol-testing-db:latest -o /tmp/db-image.tar

      - name: Build and cache test-runner image
        env:
          TARGET_PROTOCOLS: ${{ needs.detect-changes.outputs.target-protocols }}
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache \
            --build-arg PROTOCOLS="$TARGET_PROTOCOLS" \
            -f protocols/testing/run.Dockerfile \
            -t protocol-testing-test-runner:latest \
            --load .
          docker save protocol-testing-test-runner:latest -o /tmp/test-runner-image.tar

      - name: Upload docker images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docker-images-${{ steps.cache-key.outputs.key }}
          path: |
            /tmp/db-image.tar
            /tmp/test-runner-image.tar
          retention-days: 1

  test-protocols:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: needs.detect-changes.outputs.target-protocols != ''
    # See build-images: gate fork PRs behind required-reviewer approval.
    environment: ${{ github.event.pull_request.head.repo.fork && 'integration-tests' || '' }}
    env:
      RPC_URL: ${{ secrets.RPC_URL_ARCHIVE }}
      ARC_RPC_URL: ${{ secrets.ARC_RPC_URL_ARCHIVE }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL_ARCHIVE }}
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL_ARCHIVE }}
      UNICHAIN_RPC_URL: ${{ secrets.UNICHAIN_RPC_URL_ARCHIVE }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL_ARCHIVE }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL_ARCHIVE }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL_ARCHIVE }}
      SUBSTREAMS_API_TOKEN: ${{ secrets.SUBSTREAMS_API_TOKEN }}
      AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.detect-changes.outputs.protocols-matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download docker images
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: docker-images-${{ needs.build-images.outputs.cache-key }}
          path: /tmp

      - name: Load docker images
        run: |
          docker load -i /tmp/db-image.tar
          docker load -i /tmp/test-runner-image.tar

      - name: Run protocol test
        uses: ./.github/actions/substreams-docker-single
        with:
          protocol: ${{ matrix.protocol }}

  skip-tests:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.target-protocols == ''
    steps:
      - name: Skip tests
        run: echo "No protocols to test - skipping"
