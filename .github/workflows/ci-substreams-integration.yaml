name: Substreams Integration Tests

env:
  # Secrets are intentionally NOT defined here to keep them out of detect-changes scope.
  # They are set at job level in test-protocols, the only job that needs them.
  EXCLUDED_SUBSTREAMS: target|crates|ethereum-template-factory|ethereum-template-singleton|ethereum-fluid

on:
  workflow_dispatch:
    inputs:
      protocols:
        description: 'Space-separated list of protocols to test (leave empty for all)'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'protocols/substreams/**'
      - 'protocols/testing/**'
    # SECURITY: Uses pull_request (not pull_request_target) so fork PRs run with
    # a read-only GITHUB_TOKEN and no secrets. RPC/API secrets are only available
    # via workflow_dispatch. Fork PR integration tests that require secrets will
    # fail gracefully or skip.

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      protocol-testing-changed: ${{ steps.protocol-testing-files-changed.outputs.any_changed }}
      substreams-changed: ${{ steps.substreams-files-changed.outputs.any_changed }}
      all-substreams: ${{ steps.all_substreams.outputs.all_substreams }}
      changed-substreams: ${{ steps.changes.outputs.changed_substreams }}
      target-protocols: ${{ steps.target-protocols.outputs.protocols }}
      protocols-matrix: ${{ steps.protocols-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check if any files changed under protocol-testing
        id: protocol-testing-files-changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        with:
          files: protocols/testing/**

      - name: Check if any files changed under substreams
        id: substreams-files-changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        with:
          files: protocols/substreams/**

      - name: Check if Dockerfile changed
        id: dockerfile-changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        with:
          files: protocols/testing/run.Dockerfile

      - name: Check if Cargo.toml changed
        id: cargo-toml-changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # v45
        with:
          files: protocols/testing/Cargo.toml

      - name: Parse clone protocol mappings from test_runner.rs
        id: clone_mappings
        run: |
          # Extract CLONE_TO_BASE_PROTOCOL from Rust source (single source of truth).
          MAPPINGS=$(awk '/static CLONE_TO_BASE_PROTOCOL/,/}\);/' \
            protocols/testing/src/test_runner.rs | \
            grep '("' | grep -oP '"[^"]*"' | paste - - | tr -d '"')
          CLONE_NAMES=$(echo "$MAPPINGS" | awk '{print $1}' | tr '\n' ' ' | sed 's/ *$//')
          echo "clone_names=$CLONE_NAMES" >> "$GITHUB_OUTPUT"
          echo "Clone protocols: $CLONE_NAMES"
          # Store full mappings for the changes step (clone=base format).
          echo "$MAPPINGS" | awk '{print $1 "=" $2}' > /tmp/clone_mappings.txt

      - name: Get all substreams folders
        id: all_substreams
        env:
          CLONE_NAMES: ${{ steps.clone_mappings.outputs.clone_names }}
        run: |
          FOLDERS=$(find protocols/substreams -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; | sort | \
            grep -v -E "^(${EXCLUDED_SUBSTREAMS})$" | \
            tr '\n' ' ')
          ALL="$FOLDERS $CLONE_NAMES"
          ALL=$(echo $ALL | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          if [ -z "$ALL" ]; then
            echo "No substreams folders found"
          else
            echo "Substreams folders (including clones): $ALL"
          fi
          echo "all_substreams=$ALL" >> "$GITHUB_OUTPUT"

      - name: Get changed substreams folders
        id: changes
        if: steps.substreams-files-changed.outputs.any_changed == 'true'
        env:
          VALID: ${{ steps.all_substreams.outputs.all_substreams }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Read clone-to-base mappings parsed from test_runner.rs.
          declare -A CLONE_TO_BASE
          while IFS='=' read -r clone base; do
            CLONE_TO_BASE["$clone"]="$base"
          done < /tmp/clone_mappings.txt

          # Detect changed top-level substreams directories from git diff.
          CHANGED_DIRS=$(git diff --name-only --diff-filter=d origin/main \
            "$HEAD_SHA" | \
            grep '^protocols/substreams/' | awk -F'/' '{print $3}' | sort -u)

          # Match against known protocols (base dirs and clone names).
          CHANGED=$(echo "$CHANGED_DIRS" | \
            grep -Fx "$(printf '%s\n' ${VALID})" | \
            tr '\n' ' ' | sed 's/ *$//')

          # When a base directory changes, also add any clone protocols that use it.
          for clone in "${!CLONE_TO_BASE[@]}"; do
            base="${CLONE_TO_BASE[$clone]}"
            if echo "$CHANGED_DIRS" | grep -qx "$base"; then
              CHANGED="$CHANGED $clone"
            fi
          done

          CHANGED=$(echo $CHANGED | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "changed_substreams=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed substreams: $CHANGED"

      - name: Determine target protocols
        id: target-protocols
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROTOCOLS: ${{ github.event.inputs.protocols }}
          ALL_SUBSTREAMS: ${{ steps.all_substreams.outputs.all_substreams }}
          CHANGED_SUBSTREAMS: ${{ steps.changes.outputs.changed_substreams }}
          DOCKERFILE_CHANGED: ${{ steps.dockerfile-changed.outputs.any_changed }}
          CARGO_TOML_CHANGED: ${{ steps.cargo-toml-changed.outputs.any_changed }}
          SUBSTREAMS_CHANGED: ${{ steps.substreams-files-changed.outputs.any_changed }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_PROTOCOLS" ]]; then
              PROTOCOLS="$INPUT_PROTOCOLS"
            else
              PROTOCOLS="$ALL_SUBSTREAMS"
            fi
          elif [[ "$DOCKERFILE_CHANGED" == "true" ]]; then
            PROTOCOLS="$ALL_SUBSTREAMS"
          elif [[ "$CARGO_TOML_CHANGED" == "true" ]]; then
            PROTOCOLS="$ALL_SUBSTREAMS"
          elif [[ "$SUBSTREAMS_CHANGED" == "true" ]]; then
            PROTOCOLS="$CHANGED_SUBSTREAMS"
          else
            PROTOCOLS=""
          fi
          echo "protocols=$PROTOCOLS" >> "$GITHUB_OUTPUT"
          echo "Target protocols: $PROTOCOLS"

      - name: Create protocols matrix
        id: protocols-matrix
        env:
          PROTOCOLS: ${{ steps.target-protocols.outputs.protocols }}
        run: |
          if [[ -z "$PROTOCOLS" ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            MATRIX_JSON="{\"include\":["
            FIRST=true
            for protocol in $PROTOCOLS; do
              if [[ "$FIRST" == "true" ]]; then
                FIRST=false
              else
                MATRIX_JSON+=","
              fi
              MATRIX_JSON+="{\"protocol\":\"$protocol\"}"
            done
            MATRIX_JSON+="]}"
            echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
            echo "Generated matrix: $MATRIX_JSON"
          fi

  build-images:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.target-protocols != ''
    # With pull_request trigger, fork PRs have no secrets. Docker images are
    # built from PR-supplied Dockerfiles — safe because there are no secrets
    # to exfiltrate. On workflow_dispatch, secrets are available.
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate cache key
        id: cache-key
        run: |
          KEY="docker-images-${{ hashFiles('protocols/testing/postgres.Dockerfile', 'protocols/testing/run.Dockerfile') }}-${{ github.sha }}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Cache Docker layers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and cache DB image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache \
            -f protocols/testing/postgres.Dockerfile \
            -t protocol-testing-db:latest \
            --load .
          docker save protocol-testing-db:latest -o /tmp/db-image.tar

      - name: Build and cache test-runner image
        env:
          TARGET_PROTOCOLS: ${{ needs.detect-changes.outputs.target-protocols }}
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache \
            --build-arg PROTOCOLS="$TARGET_PROTOCOLS" \
            -f protocols/testing/run.Dockerfile \
            -t protocol-testing-test-runner:latest \
            --load .
          docker save protocol-testing-test-runner:latest -o /tmp/test-runner-image.tar

      - name: Upload docker images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docker-images-${{ steps.cache-key.outputs.key }}
          path: |
            /tmp/db-image.tar
            /tmp/test-runner-image.tar
          retention-days: 1

  test-protocols:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: needs.detect-changes.outputs.target-protocols != ''
    # With pull_request trigger, fork PRs have no secrets — RPC/API env vars
    # will be empty. Protocol tests requiring RPC will fail on fork PRs. On
    # workflow_dispatch, secrets are available.
    env:
      RPC_URL: ${{ secrets.RPC_URL_ARCHIVE }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL_ARCHIVE }}
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL_ARCHIVE }}
      UNICHAIN_RPC_URL: ${{ secrets.UNICHAIN_RPC_URL_ARCHIVE }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL_ARCHIVE }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL_ARCHIVE }}
      SUBSTREAMS_API_TOKEN: ${{ secrets.SUBSTREAMS_API_TOKEN }}
      AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.detect-changes.outputs.protocols-matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download docker images
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: docker-images-${{ needs.build-images.outputs.cache-key }}
          path: /tmp

      - name: Load docker images
        run: |
          docker load -i /tmp/db-image.tar
          docker load -i /tmp/test-runner-image.tar

      - name: Run protocol test
        uses: ./.github/actions/substreams-docker-single
        with:
          protocol: ${{ matrix.protocol }}

  skip-tests:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.target-protocols == ''
    steps:
      - name: Skip tests
        run: echo "No protocols to test - skipping"
