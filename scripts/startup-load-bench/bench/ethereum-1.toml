# ethereum-1: the idle prod ethereum pod, reached from inside the cluster through its own Service

[target]
name = "ethereum-1"
chain = "ethereum"
url = "http://ethereum-tycho-indexer-1.prod-tycho.svc:8080"
plan_header = "default"      # sent as X-User-Plan: the indexer applies that plan's rules (no auth-proxy on this path)
pod_selector = 'namespace="prod-tycho", pod=~"ethereum-tycho-indexer-1-.*"'
live_pod_selector = 'namespace="prod-tycho", pod=~"ethereum-tycho-indexer-2-.*"'   # the live pod, to measure how far the target falls behind
rds_instance = "prod-ethereum"

[rules]   # what the target's plan lets these clients do; profiles and scenarios stay inside
tvl_floor = 0.1
max_version_age_s = 600
version_age_slack_s = 240   # "max" version age = limit minus this, so the version stays allowed until the startup ends

[[profiles]]
# Fynd: current tycho-client (contract chunks of 100), Fynd's TVL filter, every protocol it routes.
name = "fynd"
weight = 3
tvl_gt = 4.5455
protocols = "all"
exclude = ["vm:balancer_v2", "vm:balancer_v3", "vm:liquidityparty"]
page_size = 2550
state_chunk = 360
contract_chunk = 100
ep_chunk = 100

[[profiles]]
# Most solvers: old tycho-client (contract chunks of 1200), high TVL, one components page per protocol, hooks and curve included.
name = "solver_old_client"
weight = 5
tvl_gt = 10.0
protocols = "all"
page_size = 2550
state_chunk = 360
contract_chunk = 1200
ep_chunk = 100

[[profiles]]
# A solver on 7 protocols with components pages of 500, old client.
name = "solver_pages_500"
weight = 1
tvl_gt = 10.0
protocols = ["uniswap_v4_hooks", "vm:curve", "ekubo_v2", "ekubo_v3", "vm:maverick_v2", "uniswap_v4", "uniswap_v3"]
page_size = 500
state_chunk = 360
contract_chunk = 1200
ep_chunk = 100

[[profiles]]
# Frontends: everything, at the plan floor, pages of 500, small chunks, their own id order.
name = "low_tvl_broad"
weight = 2
tvl_gt = 0.1
protocols = "all"
page_size = 500
state_chunk = 100
contract_chunk = 10
ep_chunk = 100
sort_contracts = false

[[profiles]]
# Native-only clients: no entry points, no contract state.
name = "state_only"
weight = 1
tvl_gt = 1.0
protocols = ["uniswap_v2", "uniswap_v3", "uniswap_v4", "pancakeswap_v2", "sushiswap_v2", "pancakeswap_v3"]
page_size = 2550
state_chunk = 360
contract_chunk = 100
ep_chunk = 100
no_dci = true

# Scenarios run in this order. A scenario whose result file exists is skipped. A wave that restarts the pod is
# recorded as such and the run waits for the pod to come back before the next one.
[[scenarios]]
# one client, the baseline
name = "mix_n1"
set = "realistic"
startups = 1

[[scenarios]]
name = "mix_n8"
set = "realistic"
startups = 8

[[scenarios]]
name = "mix_n16"
set = "realistic"
startups = 16

[[scenarios]]
name = "mix_n32"
set = "realistic"
startups = 32

[[scenarios]]
# 32 clients starting over one minute
name = "staggered_n32_60s"
set = "realistic"
startups = 32
spread_s = 60

[[scenarios]]
# 64 clients starting over five minutes
name = "staggered_n64_300s"
set = "realistic"
startups = 64
spread_s = 300

[[scenarios]]
# last on purpose: a 22 GiB dev pod died at 32; the 44 GiB prod pod gets to try 64
name = "mix_n64"
set = "realistic"
startups = 64

[[scenarios]]
# the broadest client the plan allows: every protocol at the TVL floor
name = "broad_floor_n4"
set = "worst"
startups = 4
profile = "low_tvl_broad"

[[scenarios]]
name = "broad_floor_n8"
set = "worst"
startups = 8
profile = "low_tvl_broad"

[[scenarios]]
name = "broad_floor_n16"
set = "worst"
startups = 16
profile = "low_tvl_broad"

[[scenarios]]
# versions as old as the plan allows: below the delta window on fast chains
name = "old_version_n16"
set = "worst"
startups = 16
version_age = "max"

[[scenarios]]
# the same wave three times with 20 s between them, without waiting for idle
name = "crashloop_a_n16"
set = "worst"
startups = 16

[[scenarios]]
name = "crashloop_b_n16"
set = "worst"
startups = 16
wait_idle = false
delay_s = 20

[[scenarios]]
name = "crashloop_c_n16"
set = "worst"
startups = 16
wait_idle = false
delay_s = 20

[[scenarios]]
# pollers: 50 one-id components + one-id state request pairs per protocol per client
name = "hammer_n16"
set = "worst"
startups = 16
single_id_calls = 50
