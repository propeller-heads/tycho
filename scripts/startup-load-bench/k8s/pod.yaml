# The benchmark runner. launch.sh fills in the three placeholders (config name and the two keys)
# and applies it to prod-tycho.
# The source comes from the ConfigMap "tycho-bench" (launch.sh creates it from this directory);
# the pod builds startup-loadgen, runs bench.py with the chosen config and then serves the
# results directory on port 8000 until it is deleted (bench.py pull copies them out).
apiVersion: v1
kind: Pod
metadata:
  name: tycho-bench
  labels:
    app: tycho-bench
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: bench
      image: rust:1.91-bookworm
      command:
        - sh
        - -c
        - |
          set -e
          apt-get update -qq && apt-get install -y -qq python3 python3-zstandard >/dev/null
          mkdir -p /bench/harness /bench/loadgen/src /bench/bench /results
          cp /src/*.py /bench/harness/
          cp /src/Cargo.toml /src/Cargo.lock /bench/loadgen/
          cp /src/main.rs /bench/loadgen/src/
          cp /src/*.toml /bench/bench/ && rm /bench/bench/Cargo.toml
          cd /bench/harness
          python3 bench.py run "/bench/bench/${BENCH_CONFIG}" --out /results --yes || echo "bench.py exited with $?"
          cd /results && exec python3 -m http.server 8000 --bind 0.0.0.0
      env:
        - name: BENCH_CONFIG
          value: "${BENCH_CONFIG}"
        - name: TYCHO_API_KEY
          value: "${TYCHO_API_KEY}"
        - name: GRAFANA_API_KEY
          value: "${GRAFANA_API_KEY}"
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      volumeMounts:
        - name: src
          mountPath: /src
  volumes:
    - name: src
      configMap:
        name: tycho-bench
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values: ["on-demand"]
    # Never share a node with an indexer.
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ethereum-tycho-indexer-1
                  - ethereum-tycho-indexer-2
                  - robinhood-tycho-indexer-1
                  - robinhood-tycho-indexer-2
