services:
  db:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: protocol-testing-db:latest
    restart: "always"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_USER: postgres
      POSTGRES_DB: tycho_indexer_0
    command: postgres -c shared_preload_libraries=pg_partman_bgw,pg_cron -c cron.database_name=tycho_indexer_0
    # Host port for Postgres. Override when 5431 is taken, e.g. by another tycho stack:
    # DB_HOST_PORT=5433 docker compose up db -d
    ports:
      - "${DB_HOST_PORT:-5431}:5432"
    shm_size: "1gb"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-runner:
    build:
      # Build context is the repo root: run.Dockerfile does `COPY . .` and needs the whole
      # workspace (crates/, proto/, protocols/). BuildKit honors run.Dockerfile.dockerignore.
      context: ../../
      dockerfile: protocols/testing/run.Dockerfile
      args:
        PROTOCOLS: "${PROTOCOLS}"
    image: protocol-testing-test-runner:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUST_LOG: "${RUST_LOG:-protocol_testing=info}"
      # Test mode: "range" (default) or "full" (continuous sync to chain tip, runs indefinitely).
      MODE: "${MODE:-range}"
      DATABASE_URL: postgres://postgres:mypassword@db:5432/tycho_indexer_0
      RPC_URL: "${RPC_URL}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      ARBITRUM_RPC_URL: "${ARBITRUM_RPC_URL:-}"
      UNICHAIN_RPC_URL: "${UNICHAIN_RPC_URL:-}"
      BSC_RPC_URL: "${BSC_RPC_URL:-}"
      POLYGON_RPC_URL: "${POLYGON_RPC_URL:-}"
      SUBSTREAMS_API_TOKEN: "${SUBSTREAMS_API_TOKEN}"
    # PROTOCOLS to test separated by space and with optional filter
    # e.g. "ethereum-balancer-v2=weighted_legacy_creation ethereum-ekubo-v2"
    entrypoint: [ "/entrypoint.sh", "${PROTOCOLS}" ]

volumes:
  postgres_data:
