  # Pool that unbound and rebound both tokens before finalizing. Stores written before
  # v0.1.4 kept every historical bind, so this pool was skipped at creation and the
  # balance mapper halted on the missing pool (July 2026 incident).
  - name: test_rebind_pool_creation
    start_block: 25489000
    stop_block: 25489150
    expected_components:

