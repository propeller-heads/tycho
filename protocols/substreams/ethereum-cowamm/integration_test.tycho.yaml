  # Two pools deployed atomically: bind + finalize + factory announcement in a single
  # transaction. Binding history written in the same block was invisible to the
  # pre-v0.1.4 get_first store reads, so these pools were silently dropped.
  - name: test_atomic_pool_creation
    start_block: 20476650
    stop_block: 20476700
    expected_components:

      - id: "0xf08d4dea369c456d26a3168ff0024b904f2d8b91" #USDC/WETH
