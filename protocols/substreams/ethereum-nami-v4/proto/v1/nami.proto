syntax = "proto3";

package nami.v4;

import "tycho/evm/v1/common.proto";

message Pool {
  bytes token0 = 1;
  bytes token1 = 2;
}

// A change to a pool's tick.
message TickDelta {
  // The address of the pool.
  bytes pool_address = 1;
  // The index of the tick.
  int32 tick_index = 2;
  // The liquidity net delta of this tick. Bigint encoded as signed big endian bytes.
  bytes liquidity_net_delta = 3;
  // The log's ordinal, which orders this change within the block.
  uint64 ordinal = 4;
  tycho.evm.v1.Transaction transaction = 5;
  // The liquidity gross delta of this tick: an Algebra tick stays initialized while its gross
  // liquidity is positive, even when its net liquidity is zero. Bigint encoded as signed big
  // endian bytes.
  bytes liquidity_gross_delta = 6;
}

// A group of TickDelta
message TickDeltas {
    repeated TickDelta deltas = 1;
}

// A change to a pool's liquidity.
message LiquidityChange {
  // The address of the pool.
  bytes pool_address = 1;
  // The liquidity changed amount. Bigint encoded as signed big endian bytes.
  bytes value = 2;
  // The type of update, can be absolute or delta.
  LiquidityChangeType change_type = 3;
  // The log's ordinal, which orders this change within the block.
  uint64 ordinal = 4;
  tycho.evm.v1.Transaction transaction = 5;
}

// A group of LiquidityChange
message LiquidityChanges {
    repeated LiquidityChange changes = 1;
}

enum LiquidityChangeType {
  DELTA = 0;
  ABSOLUTE = 1;
}

// All numeric amounts below are BigInt values encoded as big-endian bytes; signed where noted.
message Events {
  repeated PoolEvent pool_events = 1;

  message PoolEvent {
    oneof typ {
      Initialize initialize = 1;
      Mint mint = 2;
      Collect collect = 3;
      Burn burn = 4;
      Swap swap = 5;
      Flash flash = 6;
      Skim skim = 7;
      Fee fee = 8;
      Plugin plugin = 9;
      PluginConfig plugin_config = 10;
      MevxRouter mevx_router = 16;
      MinGasLeft min_gas_left = 17;
      CallGasBudget call_gas_budget = 18;
      Incentive incentive = 19;
    }
    uint64 log_ordinal = 11;
    bytes pool_address = 12;
    tycho.evm.v1.Transaction transaction = 15;

    message Initialize {
      bytes sqrt_price = 1;
      int32 tick = 2;
    }

    message Mint {
      int32 tick_lower = 1;
      int32 tick_upper = 2;
      bytes amount = 3;
      bytes amount_0 = 4;
      bytes amount_1 = 5;
    }

    message Collect {
      bytes amount_0 = 1;
      bytes amount_1 = 2;
    }

    message Burn {
      int32 tick_lower = 1;
      int32 tick_upper = 2;
      bytes amount = 3;
    }

    // amount_0 and amount_1 are signed pool balance deltas.
    message Swap {
      bytes amount_0 = 1;
      bytes amount_1 = 2;
      bytes sqrt_price = 3;
      bytes liquidity = 4;
      int32 tick = 5;
    }

    message Flash {
      bytes paid_0 = 1;
      bytes paid_1 = 2;
    }

    message Skim {
      bytes amount_0 = 1;
      bytes amount_1 = 2;
    }

    // The pool's stored fee, used when the plugin does not override it.
    message Fee {
      uint32 fee = 1;
    }

    message Plugin {
      bytes plugin = 1;
    }

    message PluginConfig {
      uint32 plugin_config = 1;
    }

    // The plugin's MEVX router. The zero address disables the plugin's after-swap back-run and
    // its gas check.
    message MevxRouter {
      bytes router = 1;
    }

    // Gas the plugin requires to remain when the pool calls its afterSwap hook; the swap reverts
    // with less. Unsigned bigint.
    message MinGasLeft {
      bytes min_gas_left = 1;
    }

    // Gas the plugin forwards to its back-run self-call. Unsigned bigint.
    message CallGasBudget {
      bytes call_gas_budget = 1;
    }

    // The farming incentive the plugin's afterSwap updates. The zero address means none.
    message Incentive {
      bytes incentive = 1;
    }
  }
}
