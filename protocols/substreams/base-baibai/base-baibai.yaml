  map_protocol_changes: "entrypoint=0x98c1D9E102Eb2806D902b13186BDc7892aC4fFBa&curve_book=0x604d9b9eB1e1571C78661a6C1088427EC9c8c6E5&custodian=0xAaC48FEB93c5C97E0fb3c7C57E1633922A4ACDa3&base=0x4200000000000000000000000000000000000006&quote=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&start_block=50895895"
