specVersion: v0.1.0
package:
  name: base_baibai
  version: v0.1.0
  url: https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-baibai
  description: BaiBai CurveBook v3 on Base
protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto/
binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_baibai.wasm
modules:
  - name: map_components
    kind: map
    initialBlock: 50895895
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents
  - name: map_balances
    kind: map
    initialBlock: 50895895
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas
  - name: store_balances
    kind: store
    initialBlock: 50895895
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balances
  - name: map_protocol_changes
    kind: map
    initialBlock: 50895895
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_components
      - store: store_balances
        mode: deltas
      - map: map_balances
    output:
      type: proto:tycho.evm.v1.BlockChanges
