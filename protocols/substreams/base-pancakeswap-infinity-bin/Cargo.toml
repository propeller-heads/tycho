[package]
name = "base-pancakeswap-infinity-bin"
version = "0.1.0"
edition = "2021"

[lib]
name = "base_pancakeswap_infinity_bin"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.75"
ethabi = "18.0.0"
hex = "0.4.3"
itertools = "0.13.0"
prost = "0.11"
serde = { version = "1.0.204", features = ["derive"] }
serde_qs = "0.13.0"
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
substreams-helper = { path = "../crates/substreams-helper" }
tiny-keccak = { version = "2", features = ["keccak"] }
tycho-substreams = "0.8.0"

[dev-dependencies]
rstest = "0.24.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
anyhow = "1.0.75"
substreams-ethereum = "0.9.9"
