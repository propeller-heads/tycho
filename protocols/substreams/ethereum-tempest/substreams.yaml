specVersion: v0.1.0
package:
  name: "ethereum_tempest"
  version: v0.1.0

protobuf:
  files:
    - tycho/evm/v1/vm.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto
  excludePaths:
    - sf/substreams
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_tempest.wasm

network: mainnet

# `registry_address` is the `PrioUpdateRegistry` the router reads lanes from now. It switched
# from 0xda7afeed01fe…8c5f at block 25989123 with a plain storage write and no event, so a
# further migration needs this value changed -- it cannot be event-sourced.
params:
  map_protocol_components: &tempest_params "router_address=00000003f1ec2379e79f58e12ec6c4f51ee92149&vault_address=c9d748e601d9984a43da0b80e5b91dc28d31d9fb&registry_address=da7afeed021eafc1c1af9c362de477dad0396b81"
  store_pair_registered: *tempest_params
  store_router_state: *tempest_params
  map_vault_balance_snapshots: *tempest_params
  map_vault_balance_deltas: *tempest_params
  map_protocol_changes: *tempest_params

modules:
  - name: store_pair_registered
    kind: store
    updatePolicy: set
    valueType: string
    # Router and vault proxies are both created in the same tx at this block.
    initialBlock: &initial_block 25637319
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  # The vault address and pause flag are event-sourced rather than configured: the router can
  # migrate its vault, and a hardcoded address would silently stop balance tracking.
  - name: store_router_state
    kind: store
    updatePolicy: set
    valueType: string
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_protocol_components
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pair_registered
        mode: deltas
      - store: store_router_state
        mode: get
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_component_index
    kind: store
    updatePolicy: append
    valueType: string
    inputs:
      - map: map_protocol_components

  - name: map_vault_balance_snapshots
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_component_index
        mode: deltas
      - store: store_component_index
        mode: get
      - store: store_router_state
        mode: get
      - store: store_router_state
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: map_vault_balance_deltas
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_router_state
        mode: get
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  # `set_sum` so a rebase replaces the value and a movement adjusts it; under `add` an absolute
  # snapshot would be added to the stored value and double the inventory on a vault rotation.
  - name: store_vault_token_balances
    kind: store
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_vault_balance_snapshots
      - map: map_vault_balance_deltas

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_protocol_components
      - store: store_pair_registered
        mode: get
      - store: store_pair_registered
        mode: deltas
      - store: store_component_index
        mode: get
      - store: store_router_state
        mode: get
      - store: store_vault_token_balances
        mode: deltas
      - store: store_vault_token_balances
        mode: get
    output:
      type: proto:tycho.evm.v1.BlockChanges
