specVersion: v0.1.0
package:
  name: "base_nami_v4"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/ethereum-algebra-integral"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - algebra_integral.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/
  excludePaths:
    - google
    - tycho
    - sf/ethereum
    - sf/substreams

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_algebra_integral.wasm

modules:
  - name: map_pools_created
    kind: map
    initialBlock: 51235349 # Nami factory deployment
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:algebra.integral.v1.Pool
    inputs:
      - map: map_pools_created

  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:algebra.integral.v1.Events

  - name: map_balance_changes
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_ticks_changes
    kind: map
    inputs:
      - map: map_events
    output:
      type: proto:algebra.integral.v1.TickDeltas

  # Net and gross liquidity per tick, under `<pool>:<tick>:net` and `<pool>:<tick>:gross`.
  - name: store_ticks_liquidity
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ticks_changes

  - name: store_pool_current_tick
    kind: store
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: map_liquidity_changes
    kind: map
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:algebra.integral.v1.LiquidityChanges

  - name: store_liquidity
    kind: store
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_liquidity_changes

  - name: store_pool_plugins
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_events

  # The beacon each plugin is bound to, and a marker per beacon some plugin was bound to.
  - name: store_plugin_beacons
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pool_plugins

  # The pools whose plugin was bound to each beacon, spread over 256 keys per beacon.
  - name: store_beacon_pools
    kind: store
    updatePolicy: append
    valueType: string
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pool_plugins

  - name: map_protocol_changes
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - store: store_pools_balances
        mode: deltas
      - map: map_ticks_changes
      - store: store_ticks_liquidity
      - map: map_liquidity_changes
      - store: store_liquidity
        mode: deltas
      - store: store_pool_plugins
      - store: store_plugin_beacons
      - store: store_beacon_pools
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_pools_created: "factory=0xf4502A98A15e82D66d28D2381E2F3A407ea45b83&protocol_type_name=nami_v4_pool"
  # The Dynamic Contract Indexer runs on Ethereum only.
  map_protocol_changes: "dci=false&modules=dynamic_fee,farming,fee_override,mevx,anti_sniper"
