[package]
name = "ethereum-algebra-integral"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethereum_algebra_integral"
crate-type = ["cdylib", "rlib"]

[dependencies]
ethabi = "18.0.0"
hex-literal = "0.4.1"
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
tycho-substreams = "0.8.1"

[dev-dependencies]
rstest = "0.24.0"

[build-dependencies]
anyhow = "1.0.95"
substreams-ethereum = "0.9.9"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
