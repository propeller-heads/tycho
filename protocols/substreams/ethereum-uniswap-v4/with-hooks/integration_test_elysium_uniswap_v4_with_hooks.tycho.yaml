harness: strict
substreams_yaml_path: ./elysium-uniswap-v4-with-hooks.yaml
protocol_system: "uniswap_v4_hooks"
protocol_type_names:
  - "uniswap_v4_pool"
module_name: "map_launchpad_enriched_block_changes"
# Every direction of every pool: the hook reverts any input past the bound get_limits reports. A
# buy past the seed's extreme tick reverts PartialFillRejected; a sell past the opening price
# reverts PastOpening or PartialFillRejected. The exception is the dust band near the opening,
# where the hook settles small sells with an output of 0: get_limits reports 0 there and the
# simulation refuses a quote whose output is 0. The bound is exact in both directions on a pool with
# no initialized tick whose net liquidity is 0 (two positions cancelling at one boundary). The
# simulation drops such a tick, so on a pool that has one the limit falls short by up to 2 raw
# input units per such tick crossed. Only outside liquidity can create one. The third test's pools
# hold outside liquidity, none with such a tick, so no rounding is declared.
# The Ascend pools (the last two tests) are hard too, with no rounding: the launchpad's one position
# per pool is never removed, so no tick has zero net liquidity. A buy past the curve end or a sell
# past the position's start edge leaves input unconsumed, and the PoolManager reverts
# CurrencyNotSettled on it. The Elysium PoolManager's runtime code at block 8365800 equals
# v4-core's PoolManager's but for the 20-byte self-address immutable. Its unlock reverts
# CurrencyNotSettled (0x5212cba1) on any nonzero delta at the end of the callback, a credit
# included. On Elysium at 8365800 and 8660000, an unlock whose callback settles 1 wei of native it
# does not owe reverts so.
limits:
  kind: hard
# The PoolManager holds every pool's tokens in one balance and accounts no per-pool amount; the
# lens derives each pool's amounts from its ticks and liquidity at the current price.
balance_lens: UniswapV4Balances
# No initialized_accounts: the simulation is native and reads no contract storage, and the Elysium
# RPC failed the debug_storageRangeAt calls that would seed them when probed (Readme.md, "What the
# Elysium manifest emits", gives the date and error). Each expected pool launches inside its test's
# range, so its hook state comes from the launch transaction's storage writes.
