specVersion: v0.1.0
package:
  name: "bsc_pancakeswap_infinity_cl_hooks"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/bsc-pancakeswap-infinity-cl-hooks"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - pancakeswap_infinity_cl.proto
  importPaths:
    - ../../../proto
    - ../base-pancakeswap-infinity-cl/proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/bsc_pancakeswap_infinity_cl_hooks.wasm

# The CL package's module graph with its pool creation swapped for CLAlphaHook pools, and three
# modules that track the hook's per-pool start time. Every module without "alpha" in its name is
# the CL package's handler, re-exported by this wasm.
# initialBlock 58349512 is the BNB block the first CLAlphaHook was deployed in; no CLAlphaHook
# pool can be older.
modules:
  - name: store_alpha_start_times
    kind: store
    initialBlock: 58349512
    updatePolicy: set
    valueType: bigint
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_alpha_pools_created
    kind: map
    initialBlock: 58349512
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_alpha_start_times
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 58349512
    updatePolicy: set_if_not_exists
    valueType: proto:pancakeswap.infinity.cl.Pool
    inputs:
      - map: map_alpha_pools_created

  - name: map_alpha_start_updates
    kind: map
    initialBlock: 58349512
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
      - map: map_alpha_pools_created
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: map_alpha_entity_changes
    kind: map
    initialBlock: 58349512
    inputs:
      - map: map_alpha_pools_created
      - map: map_alpha_start_updates
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: map_events
    kind: map
    initialBlock: 58349512
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:pancakeswap.infinity.cl.Events

  - name: store_pool_current_tick
    kind: store
    initialBlock: 58349512
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: store_pool_current_sqrt_price
    kind: store
    initialBlock: 58349512
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: map_events

  - name: map_balance_changes
    kind: map
    initialBlock: 58349512
    inputs:
      - map: map_events
      - store: store_pool_current_sqrt_price
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    initialBlock: 58349512
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_ticks_changes
    kind: map
    initialBlock: 58349512
    inputs:
      - map: map_events
    output:
      type: proto:pancakeswap.infinity.cl.TickDeltas

  - name: store_ticks_liquidity
    kind: store
    initialBlock: 58349512
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ticks_changes

  - name: map_liquidity_changes
    kind: map
    initialBlock: 58349512
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:pancakeswap.infinity.cl.LiquidityChanges

  - name: store_liquidity
    kind: store
    initialBlock: 58349512
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_liquidity_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: 58349512
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_alpha_entity_changes
      - map: map_events
      - map: map_balance_changes
      - store: store_pools_balances
        mode: deltas
      - map: map_ticks_changes
      - store: store_ticks_liquidity
        mode: deltas
      - map: map_liquidity_changes
      - store: store_liquidity
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # CLAlphaHook deployments on BNB, all verified on BscScan: v1 (two instances), v2, v3. A pool
  # whose hook is not listed here is not indexed by this package.
  store_alpha_start_times: "hooks=9a9b5331ce8d74b2b721291d57de696e878353fd,72e09ebd9b24f47730b651889a4ed984cba53d90,b0baa371b899950b4ef6a27c21baf5ef7c434d0f,b0bb171d333569cfd28a37f5c5dddaaa90ad46af"
  map_alpha_start_updates: "hooks=9a9b5331ce8d74b2b721291d57de696e878353fd,72e09ebd9b24f47730b651889a4ed984cba53d90,b0baa371b899950b4ef6a27c21baf5ef7c434d0f,b0bb171d333569cfd28a37f5c5dddaaa90ad46af"
  # CLPoolManager and Vault on BNB, without 0x prefix like the CL manifests.
  map_alpha_pools_created: "pool_manager=a0FfB9c1CE1Fe56963B0321B32E7A0302114058b&vault=238a358808379702088667322f80aC48bAd5e6c4&hooks=9a9b5331ce8d74b2b721291d57de696e878353fd,72e09ebd9b24f47730b651889a4ed984cba53d90,b0baa371b899950b4ef6a27c21baf5ef7c434d0f,b0bb171d333569cfd28a37f5c5dddaaa90ad46af"
  map_events: "a0FfB9c1CE1Fe56963B0321B32E7A0302114058b"
