[package]
name = "bsc-pancakeswap-infinity-cl-hooks"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsc_pancakeswap_infinity_cl_hooks"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
anyhow = "1.0.75"
ethabi = "18.0.0"
substreams-helper = { path = "../crates/substreams-helper" }
tycho-substreams = "0.8.0"
hex = "0.4.3"
serde = { version = "1.0.204", features = ["derive"] }
serde_qs = "0.13.0"

# Every module this package does not define comes from the CL package.
base-pancakeswap-infinity-cl = { path = "../base-pancakeswap-infinity-cl" }

[dev-dependencies]
rstest = "0.24.0"
tiny-keccak = { version = "2", features = ["keccak"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
