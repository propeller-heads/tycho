specVersion: v0.1.0
package:
  name: "base_aerodrome_v1"
  version: v0.1.1
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/protocols/substreams/base-aerodrome-v1"

protobuf:
  files:
    - tycho/evm/v1/common.proto
  importPaths:
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_aerodrome_v1.wasm

modules:
  - name: map_pools_created
    kind: map
    initialBlock: 3200559
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    initialBlock: 3200559
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.v1.ProtocolComponent
    inputs:
      - map: map_pools_created

  - name: map_protocol_changes
    kind: map
    initialBlock: 3200559
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_pools_created: "factory_address=420DD381b31aEf6683db6B902084cB0FFECe40Da&protocol_type_name=aerodrome_v1_pool&stable_fee=5&volatile_fee=30"
  map_protocol_changes: "factory_address=420DD381b31aEf6683db6B902084cB0FFECe40Da"
