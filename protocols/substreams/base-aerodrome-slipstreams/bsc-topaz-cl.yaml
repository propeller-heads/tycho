specVersion: v0.1.0
package:
  name: "bsc_topaz_cl"
  version: v0.1.7
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/base-aerodrome-slipstreams"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/utils.proto
    - slipstreams.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_aerodrome_slipstreams.wasm

modules:
  - name: map_tick_spacing_fee
    kind: map
    # The factory's constructor enables five tick spacings in its deployment block, and a pool
    # whose tick spacing has no stored fee is skipped, so indexing must start at the factory
    # rather than at the first pool (block 98,761,466).
    initialBlock: &initial_block 98756164
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.aerodrome.TickSpacingFees

  - name: store_tick_spacing_fee
    kind: store
    updatePolicy: set
    valueType: proto:slipstreams.TickSpacingFees
    inputs:
      - map: map_tick_spacing_fee

  - name: map_pools_created
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_tick_spacing_fee
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:slipstreams.Pool
    inputs:
      - map: map_pools_created

  - name: store_dynamic_fee_config
    kind: store
    initialBlock: *initial_block
    updatePolicy: set
    valueType: bigint
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_balance_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
      - store: store_dynamic_fee_config
        mode: deltas
      - store: store_dynamic_fee_config
      - store: store_pools_balances
        mode: deltas
      - map: map_balance_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # The factory's first swap fee module (0xa0462a52af4f8cbf7766efbba75355b30b6bcce2) was replaced
  # at block 98,757,673, before the first pool, so only its replacement is listed, from its
  # deployment block.
  map_tick_spacing_fee: &topaz_cl_params "factories[]=73DC984D9490286E735548f61dfCCec67Af82ed9&dynamic_fee_modules[]=656cf5d2f1A70177E011e2c27DeafBeE4C7B0541&protocol_type_name=topaz_cl_pool&first_dynamic_fee_module_block=98757661"
  map_pools_created: *topaz_cl_params
  store_dynamic_fee_config: *topaz_cl_params
  map_protocol_changes: *topaz_cl_params
