specVersion: v0.1.0
package:
  name: "robinhood_topaz_cl"
  version: v0.1.7
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-aerodrome-slipstreams"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/utils.proto
    - slipstreams.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_aerodrome_slipstreams.wasm

modules:
  - name: map_tick_spacing_fee
    kind: map
    # The factory's constructor enables five tick spacings in its deployment block, and a pool
    # whose tick spacing has no stored fee is skipped, so indexing must start at the factory
    # rather than at the first pool (block 60,814,279).
    initialBlock: &initial_block 60744015
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.aerodrome.TickSpacingFees

  - name: store_tick_spacing_fee
    kind: store
    updatePolicy: set
    valueType: proto:slipstreams.TickSpacingFees
    inputs:
      - map: map_tick_spacing_fee

  - name: map_pools_created
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_tick_spacing_fee
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:slipstreams.Pool
    inputs:
      - map: map_pools_created

  - name: store_dynamic_fee_config
    kind: store
    initialBlock: *initial_block
    updatePolicy: set
    valueType: bigint
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_balance_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
      - store: store_dynamic_fee_config
        mode: deltas
      - store: store_dynamic_fee_config
      - store: store_pools_balances
        mode: deltas
      - map: map_balance_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # The factory's first swap fee module (0x3ae3642ecebb720e48fe3f8feff5f7b5c50f98f6, until block
  # 60,854,672) emitted no events, so only its replacement is listed, from its deployment block.
  map_tick_spacing_fee: &topaz_cl_params "factories[]=aa5865dc3a60b25d305226d66fd573021f0d8ffb&dynamic_fee_modules[]=0Dca13b1039277d82B27ADd86d06195B8E9BBfDb&protocol_type_name=topaz_cl_pool&first_dynamic_fee_module_block=60854474"
  map_pools_created: *topaz_cl_params
  store_dynamic_fee_config: *topaz_cl_params
  map_protocol_changes: *topaz_cl_params
