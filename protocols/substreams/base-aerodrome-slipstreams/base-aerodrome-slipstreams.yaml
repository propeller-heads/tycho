specVersion: v0.1.0
package:
  name: "base_aerodrome_slipstreams"
  version: v0.1.4
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/base-aerodrome-slipstreams"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/utils.proto
    - slipstreams.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_aerodrome_slipstreams.wasm

modules:
  - name: map_tick_spacing_fee
    kind: map
    initialBlock: &initial_block 13843704
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.aerodrome.TickSpacingFees

  - name: store_tick_spacing_fee
    kind: store
    updatePolicy: set
    valueType: proto:slipstreams.TickSpacingFees
    inputs:
      - map: map_tick_spacing_fee

  - name: map_pools_created
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_tick_spacing_fee
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:slipstreams.Pool
    inputs:
      - map: map_pools_created

  - name: store_dynamic_fee_config
    kind: store
    initialBlock: *initial_block
    updatePolicy: set
    valueType: bigint
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_balance_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
      - store: store_dynamic_fee_config
        mode: deltas
      - store: store_dynamic_fee_config
      - store: store_pools_balances
        mode: deltas
      - map: map_balance_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_tick_spacing_fee: &slipstreams_params "factories[]=5e7BB104d84c7CB9B682AaC2F3d509f5F406809A&factories[]=aDe65c38CD4849aDBA595a4323a8C7DdfE89716a&factories[]=f8f2eB4940CFE7d13603DDDD87f123820Fc061Ef&dynamic_fee_modules[]=090b2A6bb475c00e2256e2095A60887cD710803b&dynamic_fee_modules[]=F4Ecd78EBEB6d36CF7f80B5B6B41453515fe2785&dynamic_fee_modules[]=87D8f999BBa9343E8099552426775B51C338E8CB"
  map_pools_created: *slipstreams_params
  store_dynamic_fee_config: *slipstreams_params
  map_protocol_changes: *slipstreams_params
