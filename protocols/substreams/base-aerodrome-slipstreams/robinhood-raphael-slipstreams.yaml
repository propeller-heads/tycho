specVersion: v0.1.0
package:
  name: "robinhood_raphael_slipstreams"
  version: v0.1.7
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/base-aerodrome-slipstreams"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/utils.proto
    - slipstreams.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_aerodrome_slipstreams.wasm

modules:
  - name: map_tick_spacing_fee
    kind: map
    # The factory's constructor enables five tick spacings in its deployment block, and a pool
    # whose tick spacing has no stored fee is skipped, so indexing must start at the factory
    # rather than at the first pool (block 56,766,250).
    initialBlock: &initial_block 54366500
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.aerodrome.TickSpacingFees

  - name: store_tick_spacing_fee
    kind: store
    updatePolicy: set
    valueType: proto:slipstreams.TickSpacingFees
    inputs:
      - map: map_tick_spacing_fee

  - name: map_pools_created
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_tick_spacing_fee
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:slipstreams.Pool
    inputs:
      - map: map_pools_created

  - name: store_dynamic_fee_config
    kind: store
    initialBlock: *initial_block
    updatePolicy: set
    valueType: bigint
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  - name: map_balance_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
      - store: store_dynamic_fee_config
        mode: deltas
      - store: store_dynamic_fee_config
      - store: store_pools_balances
        mode: deltas
      - map: map_balance_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # The factory set this swap fee module at block 54,366,756, before its first pool. The module's
  # defaultScalingFactor is non-zero, so it charges a dynamic fee to pools it holds no config for,
  # and every pool is marked with it from creation.
  map_tick_spacing_fee: &raphael_params "factories[]=5481864ddd46a2d798df0925c23b7846e776e5e3&dynamic_fee_modules[]=8649D7A63499a6Cd5E400EF2DdB4AD317359c23c&protocol_type_name=raphael_slipstreams_pool&first_dynamic_fee_module_block=54366715&creation_dynamic_fee_module=8649D7A63499a6Cd5E400EF2DdB4AD317359c23c"
  map_pools_created: *raphael_params
  store_dynamic_fee_config: *raphael_params
  map_protocol_changes: *raphael_params
