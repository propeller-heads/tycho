[package]
name = "tycho-seed-format"
version = "0.1.0"
edition = "2021"
description = "Header of the seed files Substreams packages embed to start from a snapshot; shared by the packages (wasm32) and their native seed writers"
repository = "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/crates/tycho-seed-format"
license = "MIT"

[dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
