[package]
name = "ethereum-etherfi"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethereum_etherfi"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
tycho-substreams = "0.8.0"
substreams-helper = { git = "https://github.com/propeller-heads/tycho-protocol-sdk.git", tag = "0.5.0" }
anyhow = "1.0.95"
ethabi = "18.0.0"
num-bigint = "0.4.6"
hex = { version = "0.4", features = ["serde"] }
itertools = "0.10.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[build-dependencies]
anyhow = "1"
substreams-ethereum = "0.9.9"
