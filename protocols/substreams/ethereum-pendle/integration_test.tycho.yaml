substreams_yaml_path: ./substreams.yaml
# No adapter contract: Pendle is a native (Rust) integration, so there is no VM SwapAdapter to
# build. The simulation lands in PR 2.
skip_balance_check: false
protocol_type_names:
  - "pendle_market"
  - "pendle_sy"
protocol_system: "pendle"
# Each test is packed with every module's `initialBlock` rewritten to that test's `start_block`
# (`protocols/testing/src/utils.rs:229`), so a range is self-contained: `store_market_registry` and
# `store_protocol_components` both start empty at `start_block`. That is what makes a range away
# from the package's own `initialBlock` safe — `map_protocol_changes` republishes state for every
# live market it finds in the registry, and the registry only ever holds markets the range itself
# created, so it can never emit state for a component this test's fresh database has not seen.
#
# Two ranges, because Pendle has two incompatible factory generations and each is only reachable in
# its own era: the original factory in 2022, the current one in 2026.
tests:
  # The original factory (`0x27b1dacd…`), whose `CreateNewMarket` carries no `lnFeeRateRoot` and
  # whose fee config is keyed by router alone.
  #
  # 16032059 is that factory's deployment block; the first four markets are created between
  # 16032202 and 16032230. Pendle's first mainnet swap is at 16067529, and by 16072689 four
  # separate markets have traded, which is what makes the upper bound worth reaching.
  - name: test_market_creation_and_swaps
    start_block: 16032059
    stop_block: 16072700
    expected_components:
      # A market and the SY behind it, created in the same transaction. This market is the first
      # to trade on mainnet (block 16069013) and trades 40 more times before the range ends, so
      # the reserve replay, the implied rate and the balances are all exercised, not just creation.
      - id: "0x7b246b8dbc2a640bf2d8221890cee8327fc23917"
        tokens:
          - "0xd393d1ddd6b8811a86d925f5e14014282581bc04" # SY-aUSDC
          - "0x5fe30ac5cb1abb0e44cdffb2916c254aeb368650" # PT
          - "0xc5cd692e9b4622ab8cdb57c83a0f99f874a169cd" # YT
        static_attributes:
          scalar_root: "0x0181cd70b593dc0000"
          initial_anchor: "0x0e06ba4b4ee1f600"
          expiry: "0x6424d100"
          factory: "0x27b1dacd74688af24a64bd3c9c1b143118740784"
          ln_fee_rate_root_at_creation: "0x00"
          sy_address: "0xd393d1ddd6b8811a86d925f5e14014282581bc04"
          pt_address: "0x5fe30ac5cb1abb0e44cdffb2916c254aeb368650"
          yt_address: "0xc5cd692e9b4622ab8cdb57c83a0f99f874a169cd"
          sy_decimals: "0x12"
          asset_decimals: "0x12"
        creation_tx: "0x6edb7e8dd09fa0e9ccd4b7195d514d51e03d91e9c05147fac6e458cc6b63bf01"
        skip_simulation: false
        # No executor yet: the swap encoder and PendleExecutor are PR 3.
        skip_execution: true

      # The SY of the market above. One token in and out, both one_to_one — the simplest wrap
      # edge, and the case where a silent 1:1 assumption would be indistinguishable from a correct
      # classification, so it pins the classifier's output shape.
      - id: "0xd393d1ddd6b8811a86d925f5e14014282581bc04"
        tokens:
          - "0xd393d1ddd6b8811a86d925f5e14014282581bc04" # SY
          - "0x3175df0976dfa876431c2e9ee6bc45b65d3473cc" # the accounting asset
        static_attributes:
          asset_address: "0x3175df0976dfa876431c2e9ee6bc45b65d3473cc"
          asset_decimals: "0x12"
          sy_decimals: "0x12"
          token_in_class_0x3175df0976dfa876431c2e9ee6bc45b65d3473cc: "0x6f6e655f746f5f6f6e65"
          token_out_class_0x3175df0976dfa876431c2e9ee6bc45b65d3473cc: "0x6f6e655f746f5f6f6e65"
        creation_tx: "0x6edb7e8dd09fa0e9ccd4b7195d514d51e03d91e9c05147fac6e458cc6b63bf01"
        skip_simulation: false
        skip_execution: true

      # A second market, on a different SY, that also trades inside the range (16072670 onward).
      # Two markets with real swaps is what the brief asks the range to contain.
      - id: "0x54e28e62ea9e8d755dc6e74674eabe2abfdb004e"
        tokens:
          - "0xcbc72d92b2dc8187414f6734718563898740c0bc" # SY-wstETH
          - "0xcf44e8402a99db82d2acccc4d9354657be2121db" # PT
          - "0xa53ad7e3a87546cca450992d54d517c3c939c2bf" # YT
        static_attributes:
          scalar_root: "0x01b3c335a2bb440000"
          initial_anchor: "0x0e2979273c640000"
          expiry: "0x6424d100"
          factory: "0x27b1dacd74688af24a64bd3c9c1b143118740784"
          ln_fee_rate_root_at_creation: "0x00"
          sy_address: "0xcbc72d92b2dc8187414f6734718563898740c0bc"
          pt_address: "0xcf44e8402a99db82d2acccc4d9354657be2121db"
          yt_address: "0xa53ad7e3a87546cca450992d54d517c3c939c2bf"
          sy_decimals: "0x12"
          asset_decimals: "0x12"
        creation_tx: "0x952d4c25142e16032afd36d6be525aeed374517ec0942a7e879221db6ef3e032"
        skip_simulation: false
        skip_execution: true

      # SY-wstETH: three quotable entry tokens across both classes, and the one component whose
      # balances forced the switch from transfer-derived to read balances — it holds stETH, which
      # rebases without emitting Transfer. Its balance check is the regression test for that.
      - id: "0xcbc72d92b2dc8187414f6734718563898740c0bc"
        tokens:
          - "0xcbc72d92b2dc8187414f6734718563898740c0bc" # SY
          - "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2" # WETH
          - "0xae7ab96520de3a18e5e111b5eaab095312d7fe84" # stETH, the accounting asset
          - "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0" # wstETH
        static_attributes:
          asset_address: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84"
          asset_decimals: "0x12"
          sy_decimals: "0x12"
          token_in_class_0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2: "0x696e6465785f72617465"
          token_in_class_0xae7ab96520de3a18e5e111b5eaab095312d7fe84: "0x696e6465785f72617465"
          token_in_class_0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0: "0x6f6e655f746f5f6f6e65"
          token_out_class_0xae7ab96520de3a18e5e111b5eaab095312d7fe84: "0x696e6465785f72617465"
          token_out_class_0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0: "0x6f6e655f746f5f6f6e65"
        creation_tx: "0x952d4c25142e16032afd36d6be525aeed374517ec0942a7e879221db6ef3e032"
        skip_simulation: false
        skip_execution: true

  # The current factory (`0x6d247b1c…`, generation V6), whose `CreateNewMarket` carries a real
  # `lnFeeRateRoot` and whose fee overrides are keyed by (market, router). Nothing about that
  # generation is reachable from the 2022 range, and it is where new liquidity appears.
  #
  # The window opens just before the first of four V6 creations (25722461, 25732091, 25739771,
  # 25745800) and closes after both listed markets have traded: `0x47ad2cd1…` from block 25734488
  # onwards, `0x1f34887b…` at 25752719 and 25754469.
  #
  # Every value below is re-derived from chain by `scripts/expected_components.py`, which reads
  # the creation log and the SY at the creation block exactly as `map_market_components` does.
  - name: test_v6_market_creation_and_swaps
    start_block: 25722400
    stop_block: 25755000
    expected_components:
      # sUSDe market, expiring 22 Dec 2026. `ln_fee_rate_root_at_creation` is non-zero here — the
      # field the original factory's event does not carry at all, so this is the only fixture that
      # pins the V3+ event layout.
      - id: "0x47ad2cd1dd15739a7a035b9d3b7828d916fef77e"
        tokens:
          - "0xbf98480425a29197e5d99d003017f63a1e595d02" # SY-sUSDe
          - "0xb195b618ea52b77cb2a58846f452f59f8dfa9390" # PT
          - "0x89e6e5f7c3a60e7d6347f054051a29a272f4ce44" # YT
        static_attributes:
          scalar_root: "0x031f51c83cacb8954e"
          initial_anchor: "0x0e27e0ab4a78ef42"
          expiry: "0x6b077680"
          factory: "0x6d247b1c044fa1e22e6b04fa9f71baf99eb29a9f"
          ln_fee_rate_root_at_creation: "0x0f98ff9ef0555e"
          sy_address: "0xbf98480425a29197e5d99d003017f63a1e595d02"
          pt_address: "0xb195b618ea52b77cb2a58846f452f59f8dfa9390"
          yt_address: "0x89e6e5f7c3a60e7d6347f054051a29a272f4ce44"
          sy_decimals: "0x12"
          asset_decimals: "0x12"
        creation_tx: "0xdd5bb2843b595874435f1355050d543c35da13b4fbd9c4aeccc74256edba725e"
        skip_simulation: true
        skip_execution: true

      # SY-sUSDe: it takes its accounting asset USDe at the index rate and sUSDe itself 1:1, but
      # redeems only to sUSDe — an SY whose entry and exit sets differ, which neither 2022 fixture
      # exercises.
      - id: "0xbf98480425a29197e5d99d003017f63a1e595d02"
        tokens:
          - "0xbf98480425a29197e5d99d003017f63a1e595d02" # SY
          - "0x4c9edd5852cd905f086c759e8383e09bff1e68b3" # USDe, the accounting asset
          - "0x9d39a5de30e57443bff2a8307a4256c8797a3497" # sUSDe
        static_attributes:
          asset_address: "0x4c9edd5852cd905f086c759e8383e09bff1e68b3"
          asset_decimals: "0x12"
          sy_decimals: "0x12"
          token_in_class_0x4c9edd5852cd905f086c759e8383e09bff1e68b3: "0x696e6465785f72617465"
          token_in_class_0x9d39a5de30e57443bff2a8307a4256c8797a3497: "0x6f6e655f746f5f6f6e65"
          token_out_class_0x9d39a5de30e57443bff2a8307a4256c8797a3497: "0x6f6e655f746f5f6f6e65"
        creation_tx: "0xdd5bb2843b595874435f1355050d543c35da13b4fbd9c4aeccc74256edba725e"
        skip_simulation: true
        skip_execution: true

      # A second V6 market that also trades in range, on a different SY.
      - id: "0x1f34887b270bfaf56cf7973572654874c8ed740e"
        tokens:
          - "0x9f30507c264cc6eb5be35b18ff9ad7b4539aa920" # SY
          - "0xe3cdf5b8d7aedfc9f768dbdcc334146fae989188" # PT
          - "0x30aa5125e9f3d958911b180e1bbc83d7086e6a7e" # YT
        static_attributes:
          scalar_root: "0x02b12767a9e7d65290"
          initial_anchor: "0x0e1d4a337b4859ae"
          expiry: "0x6ad95200"
          factory: "0x6d247b1c044fa1e22e6b04fa9f71baf99eb29a9f"
          ln_fee_rate_root_at_creation: "0x13d6f6647fd546"
          sy_address: "0x9f30507c264cc6eb5be35b18ff9ad7b4539aa920"
          pt_address: "0xe3cdf5b8d7aedfc9f768dbdcc334146fae989188"
          yt_address: "0x30aa5125e9f3d958911b180e1bbc83d7086e6a7e"
          sy_decimals: "0x12"
          asset_decimals: "0x12"
        creation_tx: "0x35c6a24f0c9214a3809d03b539eec5ad314617c5c812c1a53750bb13e1a45131"
        skip_simulation: true
        skip_execution: true

      # This SY is the decimal-gap case the 2022 fixtures cannot produce: it quotes USDC, which
      # has 6 decimals, against an 18-decimal SY and an 18-decimal accounting asset. A conversion
      # that dropped the rescale would still look right on every 18/18 component above.
      - id: "0x9f30507c264cc6eb5be35b18ff9ad7b4539aa920"
        tokens:
          - "0x9f30507c264cc6eb5be35b18ff9ad7b4539aa920" # SY
          - "0x48f9e38f3070ad8945dfeae3fa70987722e3d89c" # the accounting asset
          - "0xdbdc1ef57537e34680b898e1febd3d68c7389bcb"
          - "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" # USDC, 6 decimals
        static_attributes:
          asset_address: "0x48f9e38f3070ad8945dfeae3fa70987722e3d89c"
          asset_decimals: "0x12"
          sy_decimals: "0x12"
          token_in_class_0x48f9e38f3070ad8945dfeae3fa70987722e3d89c: "0x696e6465785f72617465"
          token_in_class_0xdbdc1ef57537e34680b898e1febd3d68c7389bcb: "0x6f6e655f746f5f6f6e65"
          token_in_class_0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48: "0x696e6465785f72617465"
          token_out_class_0x48f9e38f3070ad8945dfeae3fa70987722e3d89c: "0x696e6465785f72617465"
          token_out_class_0xdbdc1ef57537e34680b898e1febd3d68c7389bcb: "0x6f6e655f746f5f6f6e65"
          token_out_class_0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48: "0x696e6465785f72617465"
        creation_tx: "0x35c6a24f0c9214a3809d03b539eec5ad314617c5c812c1a53750bb13e1a45131"
        skip_simulation: true
        skip_execution: true

  # The brief's reference instance: the wstETH market expiring 30 Dec 2027, created by the
  # original factory at block 17363218 and still live today. Its first swaps land at 17379452 and
  # 17379784, with four more by 17386182.
  #
  # This is the one range whose expectations can be checked against a number nobody here produced:
  # the brief quotes `scalarRoot = 86364560000000000000` (0x04ae8c8dbdaee90000) and
  # `expiry = 1830124800` (0x6d157d00) for this market, and names its SY, PT and YT.
  #
  # It is also the case where the fee cannot come from the creation event — the original factory
  # emits none, so `ln_fee_rate_root_at_creation` is zero here and the brief's
  # `lnFeeRateRoot = 499875041000000` has to be read back from `getMarketConfig`. That value lands
  # as state rather than a static attribute, so this fixture cannot assert it; `scripts/
  # verify_event_replay.py` covers the state side for this same market.
  - name: test_reference_market_creation_and_swaps
    start_block: 17363200
    stop_block: 17387000
    expected_components:
      - id: "0x34280882267ffa6383b363e278b027be083bbe3b"
        tokens:
          - "0xcbc72d92b2dc8187414f6734718563898740c0bc" # SY-wstETH
          - "0xb253eff1104802b97ac7e3ac9fdd73aece295a2c" # PT
          - "0x04b7fa1e727d7290d6e24fa9b426d0c940283a95" # YT
        static_attributes:
          scalar_root: "0x04ae8c8dbdaee90000" # 86364560000000000000
          initial_anchor: "0x11839fc78c98c000"
          expiry: "0x6d157d00" # 1830124800, 30 Dec 2027
          factory: "0x27b1dacd74688af24a64bd3c9c1b143118740784"
          ln_fee_rate_root_at_creation: "0x00"
          sy_address: "0xcbc72d92b2dc8187414f6734718563898740c0bc"
          pt_address: "0xb253eff1104802b97ac7e3ac9fdd73aece295a2c"
          yt_address: "0x04b7fa1e727d7290d6e24fa9b426d0c940283a95"
          sy_decimals: "0x12"
          asset_decimals: "0x12"
        creation_tx: "0xf5022404495cff175a5b4c45864e372f0fa2344cc8aa14298987e4ccdf6e5daa"
        skip_simulation: true
        skip_execution: true

      # The same SY the 2022 range already covers, profiled 1.3M blocks later: stETH is still the
      # accounting asset and the three entry tokens still classify the same way. A classification
      # that drifted with the exchange rate would show up as a diff here and nowhere else.
      - id: "0xcbc72d92b2dc8187414f6734718563898740c0bc"
        tokens:
          - "0xcbc72d92b2dc8187414f6734718563898740c0bc" # SY
          - "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2" # WETH
          - "0xae7ab96520de3a18e5e111b5eaab095312d7fe84" # stETH, the accounting asset
          - "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0" # wstETH
        static_attributes:
          asset_address: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84"
          asset_decimals: "0x12"
          sy_decimals: "0x12"
          token_in_class_0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2: "0x696e6465785f72617465"
          token_in_class_0xae7ab96520de3a18e5e111b5eaab095312d7fe84: "0x696e6465785f72617465"
          token_in_class_0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0: "0x6f6e655f746f5f6f6e65"
          token_out_class_0xae7ab96520de3a18e5e111b5eaab095312d7fe84: "0x696e6465785f72617465"
          token_out_class_0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0: "0x6f6e655f746f5f6f6e65"
        creation_tx: "0xf5022404495cff175a5b4c45864e372f0fa2344cc8aa14298987e4ccdf6e5daa"
        skip_simulation: true
        skip_execution: true
