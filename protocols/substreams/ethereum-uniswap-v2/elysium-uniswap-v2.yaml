specVersion: v0.1.0
package:
  name: "elysium_uniswap_v2"
  version: v0.3.3
  url: "https://github.com/propeller-heads/tycho-indexer/tree/main/protocols/substreams/ethereum-uniswap-v2"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - uniswap.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v2.wasm

modules:
  - name: map_pools_created
    kind: map
    initialBlock: 256053
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    initialBlock: 256053
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.uniswap.v2.Pool
    inputs:
      - map: map_pools_created

  - name: map_pool_events
    kind: map
    initialBlock: 256053
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_pools_created: factory_address=bbbcc62853a5fa27b93d6bab3e6f7ce841e25df2&protocol_type_name=uniswap_v2_pool
