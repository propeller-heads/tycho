specVersion: v0.1.0
package:
  name: "ethereum_erc4626"
  version: v0.1.0

protobuf:
  files:
    - tycho/evm/v1/vm.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_erc4626.wasm

modules:
  - name: map_protocol_components
    kind: map
    initialBlock: 16428133
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  - name: store_component_tokens
    kind: store
    initialBlock: 16428133
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_protocol_components

  - name: map_relative_balances
    kind: map
    initialBlock: 16428133
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_component_tokens
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_component_balances
    kind: store
    initialBlock: 16428133
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_relative_balances

  - name: store_component_first_interaction
    kind: store
    initialBlock: 16428133
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_relative_balances

  - name: map_protocol_changes
    kind: map
    initialBlock: 16428133
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_protocol_components
      - store: store_component_tokens
      - store: store_component_balances
        mode: deltas
      - map: map_relative_balances
      - store: store_component_first_interaction
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockChanges

network: mainnet

