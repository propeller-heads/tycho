substreams_yaml_path: ./substreams.yaml
protocol_system: "sky"
protocol_type_names:
  - "sky"
module_name: "map_protocol_changes"
# Balance checks compare against on-chain balanceOf(component), which does not apply here:
# the PSM's USDC sits in its pocket, the wrapper mirrors the PSM's inventory, and the
# converter reports the join escrows (vat.dai[join]) as a capacity proxy.
skip_balance_check: true
tests:
  - name: test_psm_creation
    start_block: 20283666
    stop_block: 20283700
    expected_components:
      - id: "0xf6e72db5454dd049d0788e411b06cfaf16853042"
        tokens:
          - "0x6b175474e89094c44da98b954eedeac495271d0f"
          - "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        static_attributes:
          component_type: "0x70736d"
          gem: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        creation_tx: "0x61e5d04f14d1fea9c505fb4dc9b6cf6e97bc83f2076b53cb7e92d0a2e88b6bbd"
        # The PSM was deployed empty and only funded at block 20421763, so swap limits
        # are legitimately zero in this range and no swap can be simulated or executed.
        # PSM swap math is exercised by the wrapper test (identical code path) and the
        # SkyExecutor Foundry fork tests.
        skip_simulation: true
        skip_execution: true
  - name: test_converter_creation
    start_block: 20663734
    stop_block: 20663760
    expected_components:
      - id: "0x3225737a9bbb6473cb4a45b7244aca2befdb276a"
        tokens:
          - "0x6b175474e89094c44da98b954eedeac495271d0f"
          - "0xdc035d45d973e3ec169d2276ddab16f1e407384f"
        static_attributes:
          component_type: "0x636f6e766572746572"
          gem: "0xdc035d45d973e3ec169d2276ddab16f1e407384f"
        creation_tx: "0xb63d6f4cfb9945130ab32d914aaaafbad956be3718176771467b4154f9afab61"
        # USDS does not exist until the Sky launch (block 20770191), so the
        # USDS -> DAI limit is legitimately zero in this range, the harness cannot
        # size a simulation probe, and no swap can be executed. Converter math is
        # covered by unit tests and the executor's Foundry fork tests.
        skip_simulation: true
        skip_execution: true
  - name: test_wrapper_creation
    start_block: 20668728
    stop_block: 20668760
    expected_components:
      - id: "0xa188eec8f81263234da3622a406892f3d630f98c"
        tokens:
          - "0xdc035d45d973e3ec169d2276ddab16f1e407384f"
          - "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        static_attributes:
          component_type: "0x70736d5f77726170706572"
          gem: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        creation_tx: "0x43ddae74123936f6737b78fcf785547f7f6b7b27e280fe7fbf98c81b3c018585"
        # The wrapper was deployed ~100k blocks before the Sky launch (block
        # 20770191) wired it up: the USDS join escrow (tracked as the
        # usds_escrow attribute) is zero, so the USDS -> USDC limit is
        # legitimately zero in this range and the harness cannot size a
        # simulation probe. Execution additionally reverts on-chain by
        # construction in this window (UsdsJoin lacks USDS mint authority, so
        # sellGem fails "Usds/not-authorized") — verified empirically. Both are
        # covered by unit tests, the SkyExecutor Foundry fork tests, and the
        # full run's live phase.
        skip_simulation: true
        skip_execution: true
