  store_words: *params
  map_components: *params
  map_protocol_changes: *params

modules:
  # Contracts created with a registered runtime code: `deploy:<address>` -> `<role>:<codehash>`. A pool's hooks,
  # price feed, router and factory are deployed before createPool, so this is what lets their storage be
  # tracked from their creation.
  - name: store_deployments
    kind: store
    initialBlock: 51154966
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block

  # Every tracked storage write: `word:<address>:<slot>` -> value. Read as of the start of a block by the maps.
  - name: store_words
    kind: store
    initialBlock: 51154966
    updatePolicy: set
    valueType: bytes
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_deployments

  # FLAMMFactory.PoolCreated -> the swap and lever-up components (allowlisted hook code, pinned immutables).
  - name: map_components
    kind: map
    initialBlock: 51154966
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_deployments
      - store: store_words
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  # The tracked pools: `pools` (addresses) and `pool:<address>` (the serialized tracking config).
  - name: store_pools
    kind: store
    initialBlock: 51154966
    updatePolicy: append
    valueType: string
    inputs:
      - map: map_components

  # Per transaction: components with their creation snapshot, changed words, feed attributes re-derived from the
  # feeds' words and diffed, balances.
  - name: map_protocol_changes
    kind: map
    initialBlock: 51154966
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_components
      - store: store_pools
      - store: store_words
    output:
      type: proto:tycho.evm.v1.BlockChanges
