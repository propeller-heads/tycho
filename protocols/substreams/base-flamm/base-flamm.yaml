specVersion: v0.1.0
package:
  name: "base_flamm"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-flamm"
  description: "Everlong FLAMM native indexing on Base: the pool's own state, its Morpho Blue financing and the Chainlink feeds it reads, as component attributes"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_flamm.wasm

network: base

# One params string for every module (see src/config.rs and README.md "Params"). Every value is a chain fact
# with the call that verifies it: the factory address, the invariant-hook codehash allowlist, the runtime
# codehash -> role registry (eth_getCode at 51154990 == the deployment record), the Chainlink aggregators' layout
# kinds, the aggregators whose every storage write is tracked, the seed words as of initialBlock - 1 = 51154965
# (eth_getStorageAt, cross-checked against the views in testdata/seeds_51154965.json), and the live pool's
# immutables (eth_call getters, testdata/immutables_51154990.json). The unit tests assert the manifest carries
# exactly the fixture values.
