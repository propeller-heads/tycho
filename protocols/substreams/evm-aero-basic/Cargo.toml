[package]
name = "evm-aero-basic"
version = "0.1.0"
edition = "2021"

[lib]
name = "evm_aero_basic"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
ethabi = "18.0.0"
hex = "0.4.3"
itertools = "0.12.1"
serde = "1.0.204"
serde_qs = "0.13.0"
tycho-substreams = "0.8.1"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
anyhow = "1.0.75"
substreams-ethereum = "0.9.9"
