      - id: "0x1ecab4787d2728e8a420fa08f182b596ce84f8052f4410ba4c8826c9508f0ad5"
        tokens:
          - "0x0000000000000000000000000000000000000000"
          - "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
        static_attributes:
          token0: "0x0000000000000000000000000000000000000000"
          token1: "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
          extension: "0x0000000000000000000000000000000000000000"
          fee: "0x0020c49ba5e353f7"
          pool_type_config: "0x800003e8"
        creation_tx: "0x959ac3a17bc64152a678572778d97e8ba7a5fa55dc5aa565607d7a19d80f3ac2"
        skip_execution: true # No ekubo_v3 executor is deployed on Base yet

