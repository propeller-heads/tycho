substreams_yaml_path: ./base-ekubo-v3.yaml
protocol_system: "ekubo_v3"
skip_balance_check: true # Ekubo follows a singleton design, pool balances are held in one contract
protocol_type_names:
  - "ekubo_v3_pool"
# No SignedExclusiveSwap pool exists on Base yet, so `is_exclusive` tagging is not covered here.
tests:
