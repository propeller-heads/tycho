syntax = "proto3";

package ekubo;

// Copy of tycho.evm.v1.Transaction to be able to implement conversions to/from
// TransactionTrace
message Transaction {
  bytes hash = 1;
  bytes from = 2;
  bytes to = 3;
  uint64 index = 4;
}

message TickDelta {
  bytes pool_id = 1; // bytes32
  int32 tick_index = 2;
  bytes liquidity_net_delta = 3; // int128
  uint64 ordinal = 4;
  Transaction transaction = 5;
}

message TickDeltas { repeated TickDelta deltas = 1; }

message RateDelta {
  bytes pool_id = 1; // bytes32
  uint64 time = 2;
  bytes rate_delta = 3; // int112
  bool is_token1 = 4;
  uint64 ordinal = 5;
  Transaction transaction = 6;
}

message RateDeltas { repeated RateDelta deltas = 1; }

enum ChangeType {
  DELTA = 0;
  ABSOLUTE = 1;
}

message ActiveLiquidityChange {
  bytes pool_id = 1; // bytes32
  bytes value = 2;   // uint128 or int128, depending on change_type
  ChangeType change_type = 3;
  uint64 ordinal = 4;
  Transaction transaction = 5;
}

message ActiveLiquidityChanges { repeated ActiveLiquidityChange changes = 1; }

message ActiveRateChange {
  bytes pool_id = 1;      // bytes32
  bytes token0_value = 2; // uint112 or int112, depending on change_type
  bytes token1_value = 3; // uint112 or int112, depending on change_type
  ChangeType change_type = 4;
  uint64 ordinal = 5;
  Transaction transaction = 6;
}

message ActiveRateChanges { repeated ActiveRateChange changes = 1; }

message PoolDetails {
  bytes token0 = 1; // address
  bytes token1 = 2; // address
  bool is_stableswap = 3;
}

message BlockTransactionEvents {
  repeated TransactionEvents block_transaction_events = 1;
  uint64 timestamp = 2; // block timestamp

  message TransactionEvents {
    Transaction transaction = 1;
    repeated PoolLog pool_logs = 2;

    message PoolLog {
      uint64 ordinal = 1;
      bytes pool_id = 2; // bytes32

      oneof event {
        Swapped swapped = 3;
        PositionUpdated position_updated = 4;
        PoolInitialized pool_initialized = 5;
        VirtualExecution virtual_execution = 6;
        RateUpdated rate_updated = 7;
        PoolSnapshot pool_snapshot = 8;
      }

      message Swapped {
        bytes delta0 = 1;           // int128
        bytes delta1 = 2;           // int128
        bytes sqrt_ratio_after = 3; // uint192
        bytes liquidity_after = 4;  // uint128
        sint32 tick_after = 5;      // int32
      }

      message PositionUpdated {
        sint32 lower = 1;          // int32
        sint32 upper = 2;          // int32
        bytes liquidity_delta = 3; // int128
        bytes delta0 = 4;          // int128
        bytes delta1 = 5;          // int128
      }

      message PoolInitialized {
        bytes token0 = 1;     // address
        bytes token1 = 2;     // address
        bytes config = 3;     // bytes32
        sint32 tick = 4;      // int32
        bytes sqrt_ratio = 5; // uint192
        bool has_time_rate_deltas = 6;
      }

      message VirtualExecution {
        bytes token0_rate = 1; // int112/uint112
        bytes token1_rate = 2; // int112/uint112
      }

      message RateUpdated {
        uint64 start_time = 1;       // block timestamp
        uint64 end_time = 2;         // block timestamp
        bytes token0_rate_delta = 3; // int112
        bytes token1_rate_delta = 4; // int112
      }

      // The complete state of one pool at the seed block, reconstructed by the package's seed
      // writer (`seed/`). Emitted once per pool in the synthetic seed transaction; every store
      // module rebuilds its entry for the pool from this single event.
      message PoolSnapshot {
        bytes token0 = 1;    // address
        bytes token1 = 2;    // address
        bytes config = 3;    // bytes32
        sint32 tick = 4;     // int32
        bytes sqrt_ratio = 5; // uint192
        bytes liquidity = 6; // uint128, signed big-endian like the store values it seeds
        // Initialized ticks with a nonzero net liquidity delta, sorted by index.
        repeated TickSnapshot ticks = 7;
        bytes balance0 = 8; // int128, token0 reserves implied by the liquidity distribution
        bytes balance1 = 9; // int128, token1 reserves implied by the liquidity distribution
        // Set only for pools whose extension carries time rate deltas (TWAMM, BoostedFees).
        TimedSnapshot timed = 10;
      }

      message TickSnapshot {
        sint32 index = 1;          // int32
        bytes liquidity_delta = 2; // int128
      }

      message TimedSnapshot {
        uint64 last_time = 1; // last virtual order execution / fee donation timestamp
        bytes rate0 = 2;      // uint112, signed big-endian like the store values it seeds
        bytes rate1 = 3;      // uint112, signed big-endian like the store values it seeds
        repeated RateDeltaSnapshot rate_deltas = 4;
      }

      // Rate deltas becoming active at `time`. An empty delta means "no delta for this token",
      // mirroring `RateUpdated`.
      message RateDeltaSnapshot {
        uint64 time = 1;
        bytes delta0 = 2; // int112
        bytes delta1 = 3; // int112
      }
    }
  }
}

// Body of the package's seed file: the state of every Ekubo v3 pool after the seed block. The
// block itself is named by the seed file's header, so an empty body is a valid seed of no pools.
message Seed {
  repeated PoolSeed pools = 1;
}

message PoolSeed {
  bytes pool_id = 1;          // bytes32
  bytes sqrt_ratio_float = 2; // uint96, the packed float as stored by the core contract
  // `snapshot.sqrt_ratio` is left empty; the package fills it from `sqrt_ratio_float`.
  BlockTransactionEvents.TransactionEvents.PoolLog.PoolSnapshot snapshot = 3;
}
