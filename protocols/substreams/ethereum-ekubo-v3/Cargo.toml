[package]
name = "ethereum-ekubo-v3"
version = "0.3.0"
edition = "2021"

[lib]
name = "ethereum_ekubo_v3"
crate-type = ["cdylib"]

[dependencies]
alloy-primitives = { version = "1.4.1", features = ["serde"] }
ekubo_sdk = { version = "1.0.2", features = ["evm"] }
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
substreams-helper = { git = "https://github.com/propeller-heads/tycho-protocol-sdk.git", tag = "0.4.0" }
# Local crate until the `seed` module ships in a published tycho-substreams release.
tycho-substreams = { path = "../crates/tycho-substreams" }
prost = "0.11"
ethabi = "18.0.0"
num-bigint = "0.4.6"
itertools = "0.10.5"

[build-dependencies]
anyhow = "1"
substreams-ethereum = "0.10.1"

[dev-dependencies]
prost-types = "0.11"

