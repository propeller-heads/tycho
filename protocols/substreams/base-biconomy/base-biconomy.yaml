specVersion: v0.1.0
package:
  name: "base_biconomy"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-biconomy"
  description: "Biconomy PropAMM venue on Base: executor boards, venue makers and provider inventory"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_biconomy.wasm

modules:
  - name: map_protocol_components
    kind: map
    initialBlock: 52547671
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  - name: store_protocol_components
    kind: store
    initialBlock: 52547671
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.v1.ProtocolComponent
    inputs:
      - map: map_protocol_components

  - name: map_state_writes
    kind: map
    initialBlock: 52547671
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_protocol_components
      - store: store_protocol_components
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_state
    kind: store
    initialBlock: 52547671
    updatePolicy: set
    valueType: bytes
    inputs:
      - map: map_state_writes

  - name: map_protocol_changes
    kind: map
    initialBlock: 52547671
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_protocol_components
      - store: store_protocol_components
      - map: map_state_writes
      - store: store_state
    output:
      type: proto:tycho.evm.v1.BlockChanges

