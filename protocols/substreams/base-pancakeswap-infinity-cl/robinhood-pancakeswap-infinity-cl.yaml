specVersion: v0.1.0
package:
  name: "robinhood_pancakeswap_infinity_cl"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-pancakeswap-infinity-cl"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - pancakeswap_infinity_cl.proto
  importPaths:
    - ../../../proto
    - ./proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_pancakeswap_infinity_cl.wasm

# Same module graph and wasm as the Base manifest; only the package name, the start block and the
# contract addresses differ. Robinhood is a separate deployment, not the CREATE3 addresses Base and
# BNB share.
# initialBlock 56743018 is the first Robinhood block where CLPoolManager
# 0xeE04c68742e6Bf434bE8039580D2e89BBE55bc6f has code (binary search on eth_getCode).
modules:
  - name: map_pools_created
    kind: map
    initialBlock: 56743018
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 56743018
    updatePolicy: set_if_not_exists
    valueType: proto:pancakeswap.infinity.cl.Pool
    inputs:
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 56743018
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:pancakeswap.infinity.cl.Events

  - name: store_pool_current_tick
    kind: store
    initialBlock: 56743018
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: store_pool_current_sqrt_price
    kind: store
    initialBlock: 56743018
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: map_events

  - name: map_balance_changes
    kind: map
    initialBlock: 56743018
    inputs:
      - map: map_events
      - store: store_pool_current_sqrt_price
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    initialBlock: 56743018
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_ticks_changes
    kind: map
    initialBlock: 56743018
    inputs:
      - map: map_events
    output:
      type: proto:pancakeswap.infinity.cl.TickDeltas

  - name: store_ticks_liquidity
    kind: store
    initialBlock: 56743018
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ticks_changes

  - name: map_liquidity_changes
    kind: map
    initialBlock: 56743018
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:pancakeswap.infinity.cl.LiquidityChanges

  - name: store_liquidity
    kind: store
    initialBlock: 56743018
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_liquidity_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: 56743018
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - store: store_pools_balances
        mode: deltas
      - map: map_ticks_changes
      - store: store_ticks_liquidity
        mode: deltas
      - map: map_liquidity_changes
      - store: store_liquidity
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # CLPoolManager and Vault on Robinhood, without 0x prefix like the v4 manifests.
  # https://developer.pancakeswap.finance/contracts/infinity/resources/addresses
  map_pools_created: "pool_manager=eE04c68742e6Bf434bE8039580D2e89BBE55bc6f&vault=4F922d5B15e6691e0469663E4F5C4177f23c5FaF"
  map_events: "eE04c68742e6Bf434bE8039580D2e89BBE55bc6f"
