specVersion: v0.1.0
package:
  name: "base_pancakeswap_infinity_cl"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-pancakeswap-infinity-cl"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - pancakeswap_infinity_cl.proto
  importPaths:
    - ../../../proto
    - ./proto
  excludePaths:
    - sf/substreams
    - sf/firehose
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_pancakeswap_infinity_cl.wasm

# Module graph copied from ethereum-uniswap-v4/no-hooks/base-uniswap-v4-no-hooks.yaml.
# initialBlock 30544106 is the first Base block where CLPoolManager
# 0xa0FfB9c1CE1Fe56963B0321B32E7A0302114058b has code (binary search on eth_getCode).
modules:
  - name: map_pools_created
    kind: map
    initialBlock: 30544106
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 30544106
    updatePolicy: set_if_not_exists
    valueType: proto:pancakeswap.infinity.cl.Pool
    inputs:
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 30544106
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:pancakeswap.infinity.cl.Events

  - name: store_pool_current_tick
    kind: store
    initialBlock: 30544106
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: store_pool_current_sqrt_price
    kind: store
    initialBlock: 30544106
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: map_events

  - name: map_balance_changes
    kind: map
    initialBlock: 30544106
    inputs:
      - map: map_events
      - store: store_pool_current_sqrt_price
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    initialBlock: 30544106
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_ticks_changes
    kind: map
    initialBlock: 30544106
    inputs:
      - map: map_events
    output:
      type: proto:pancakeswap.infinity.cl.TickDeltas

  - name: store_ticks_liquidity
    kind: store
    initialBlock: 30544106
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ticks_changes

  - name: map_liquidity_changes
    kind: map
    initialBlock: 30544106
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:pancakeswap.infinity.cl.LiquidityChanges

  - name: store_liquidity
    kind: store
    initialBlock: 30544106
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_liquidity_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: 30544106
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - store: store_pools_balances
        mode: deltas
      - map: map_ticks_changes
      - store: store_ticks_liquidity
        mode: deltas
      - map: map_liquidity_changes
      - store: store_liquidity
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # CLPoolManager and Vault on Base (same addresses on BNB), without 0x prefix like the v4
  # manifests.
  map_pools_created: "pool_manager=a0FfB9c1CE1Fe56963B0321B32E7A0302114058b&vault=238a358808379702088667322f80aC48bAd5e6c4"
  map_events: "a0FfB9c1CE1Fe56963B0321B32E7A0302114058b"
