specVersion: v0.1.0
package:
  name: "ethereum_fluid_v2"
  version: v0.1.0

protobuf:
  files:
    - tycho/evm/v1/vm.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - fluid.proto
  importPaths:
    - ../../../proto
    - ./proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_fluid_v2.wasm

network: mainnet
networks:
  mainnet:
    # Deployment block of the DEX v2 proxy.
    initialBlock:
      map_pools_created: 26243693
      store_pools: 26243693
      store_pool_ids: 26243693
      map_balance_changes: 26243693
      store_pools_balances: 26243693
      map_protocol_changes: 26243693
    # dex_v2_implementation is the implementation this package and the simulation were verified
    # against; a write of any other one to the proxy pauses every pool.
    params:
      map_pools_created: "dex_v2_address=aBE4D5AA1Bb188f4B5d3a1aE3B8ec5e300A78261&dex_v2_implementation=81F4036b479D3A99c35577F2A090AE13A8115E19&resolver_address=143c3927EaF0e50a59b1651C2Eb1e37FB62Aa2a9&liquidity_address=52Aa899454998Be5b000Ad077a46Bbe360F4e497"
      map_balance_changes: "dex_v2_address=aBE4D5AA1Bb188f4B5d3a1aE3B8ec5e300A78261&dex_v2_implementation=81F4036b479D3A99c35577F2A090AE13A8115E19&resolver_address=143c3927EaF0e50a59b1651C2Eb1e37FB62Aa2a9&liquidity_address=52Aa899454998Be5b000Ad077a46Bbe360F4e497"
      map_protocol_changes: "dex_v2_address=aBE4D5AA1Bb188f4B5d3a1aE3B8ec5e300A78261&dex_v2_implementation=81F4036b479D3A99c35577F2A090AE13A8115E19&resolver_address=143c3927EaF0e50a59b1651C2Eb1e37FB62Aa2a9&liquidity_address=52Aa899454998Be5b000Ad077a46Bbe360F4e497"

modules:
  - name: map_pools_created
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.fluid_v2.Pool
    inputs:
      - map: map_pools_created

  - name: store_pool_ids
    kind: store
    updatePolicy: append
    valueType: string
    inputs:
      - map: map_pools_created

  - name: map_balance_changes
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_protocol_changes
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
      - store: store_pools_balances
        mode: deltas
      - map: map_balance_changes
      - store: store_pool_ids
    output:
      type: proto:tycho.evm.v1.BlockChanges
