substreams_yaml_path: ./substreams.yaml
protocol_system: "fluid_v2"
protocol_type_names:
  - "fluid_v2_pool"
module_name: "map_protocol_changes"
# Pool balances are the LP flows of each pool; the tokens sit in the dex float or in Fluid
# Liquidity, shared by every pool, so no account holds a pool's balance.
skip_balance_check: true

tests:
  # All four pools are created in 0x292e627c… at block 26284652. The range then covers D3
  # deposits and a withdrawal, the D4 borrow 0x33f55905…, and five swaps.
  - name: test_ethereum_pools
    start_block: 26284650
    stop_block: 26330000
    expected_components:
      - id: "0x03e018f09af38956affdfeab72c2cefbcd4e6fee44d09df7525ec9dba3e51356a5"
        tokens:
          - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC
          - "0xdAC17F958D2ee523a2206206994597C13D831ec7" # USDT
        static_attributes:
          dex_type: "0x03"
          fee: "0x64"
          tick_spacing: "0x01"
          controller: "0x0000000000000000000000000000000000000000"
          resolver: "0x143c3927eaf0e50a59b1651c2eb1e37fb62aa2a9"
          liquidity: "0x52aa899454998be5b000ad077a46bbe360f4e497"
        creation_tx: "0x292e627cd513d63d348e8cef143fc376caf3401fa3414a89e885b8890528d3a7"
        skip_simulation: false
        skip_execution: false
      - id: "0x04e018f09af38956affdfeab72c2cefbcd4e6fee44d09df7525ec9dba3e51356a5"
        tokens:
          - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC
          - "0xdAC17F958D2ee523a2206206994597C13D831ec7" # USDT
        static_attributes:
          dex_type: "0x04"
          fee: "0x64"
          tick_spacing: "0x01"
          controller: "0x0000000000000000000000000000000000000000"
          resolver: "0x143c3927eaf0e50a59b1651c2eb1e37fb62aa2a9"
          liquidity: "0x52aa899454998be5b000ad077a46bbe360f4e497"
        creation_tx: "0x292e627cd513d63d348e8cef143fc376caf3401fa3414a89e885b8890528d3a7"
        skip_simulation: false
        skip_execution: false
      - id: "0x03d0adee4ff64cfb16d76667ef79e093420a3f01cd648ffaae9bfab849449930fd"
        tokens:
          - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC
