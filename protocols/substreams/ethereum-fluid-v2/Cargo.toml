[package]
name = "ethereum-fluid-v2"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethereum_fluid_v2"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
prost = "0.11"
substreams-helper = { git = "https://github.com/propeller-heads/tycho-protocol-sdk.git", rev = "b8aeaa3" }
tycho-substreams = "0.8.1"
anyhow = "1.0.95"
ethabi = "18.0.0"
num-bigint = "0.4.6"
hex = "0.4"
itertools = "0.10.5"
tiny-keccak = { version = "2.0", features = ["keccak"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_qs = "0.13.0"

[build-dependencies]
anyhow = "1"
substreams-ethereum = "0.9.9"
